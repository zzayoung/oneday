/* OneDay 1.8: compact creation controls and a library for every record. */
.creation-controls-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:12px;margin-bottom:16px;flex-shrink:0;min-width:0}

/* Keyboard format chooser and compact, always-visible shortcut guidance. */

.live-md-help { margin: .25rem 0; color: var(--muted, #667085); font-size: .75rem; line-height: 1.4; }

/* 1.9 calendar: retain seven columns while giving the current week room. */

<!--__SITES_IDENTITY__--><script>/* OneDay Sites SDK bridge. All confirmed records and attachments come from the server. */
(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else{root.OneDayCloud=api;root.__ONEDAY_SITES__=true;root.__SMART_PAGE__={database:api.createDatabase({fetch:root.fetch.bind(root),origin:root.location.origin})};}})(typeof window!=='undefined'?window:this,function(){
'use strict';
const IDS={tasks:'oneday-tasks',logs:'oneday-logs',tags:'oneday-tags',links:'oneday-links',notes:'oneday-notes',sets:'oneday-sets',cal:'oneday-cal'};
const KEYS=Object.keys(IDS),ALIASES=new Set(['_id','id','record_id','_version']);

function canonical(row){const obj={};for(const k of Object.keys(row).filter(k=>!ALIASES.has(k)).sort())obj[k]=stable(row[k]);return JSON.stringify(obj);}

 if(!backup||backup.app&&backup.app!=='OneDay')throw Error('请选择 OneDay 的完整 JSON 备份');
 const tables={};let total=0;
 for(const key of KEYS){const rows=backup.tables?.[key];if(!Array.isArray(rows))throw Error('备份缺少 '+key+' 表');const seen=new Set();tables[key]=rows.map(row=>{
  if(!row||typeof row!=='object'||Array.isArray(row))throw Error(key+' 表存在无效记录');

  if(typeof id!=='string'||!id.trim()||id.length>256||/[\x00-\x1f\x7f]/.test(id))throw Error(key+' 表存在无效 ID 的记录');
  for(const alias of ['_id','id','record_id'])if(row[alias]!==undefined&&(typeof row[alias]!=='string'||row[alias]!==id))throw Error(key+' 表的记录 ID 别名不一致，请先核对备份');

 });total+=rows.length;}

}
function createDatabase({fetch:fetcher=globalThis.fetch,origin='',uuid=()=>globalThis.crypto.randomUUID()}={}){
 let acknowledgedRevision=null,pendingRevision=null,invalidated=true;
 const pendingCreates=new Map();let pendingStorage=null,pendingStorageKey='';
 try{if(typeof window!=='undefined'){pendingStorage=window.localStorage;pendingStorageKey='oneday.lite.v1.'+(window.__ONEDAY_SCOPE__||'sites.guest')+'.pendingCreates';const saved=JSON.parse(pendingStorage.getItem(pendingStorageKey)||'[]');for(const [key,value]of saved)if(typeof key==='string'&&value?.requestId&&value?.recordId)pendingCreates.set(key,value);}}catch(_){}
 const persistPending=()=>{try{pendingStorage?.setItem(pendingStorageKey,JSON.stringify([...pendingCreates]));}catch(_){}};
 async function creationKey(key,properties){const fields={...properties};if(['tasks','notes','tags','links'].includes(key))delete fields['创建时间'];if(key==='tasks')delete fields['状态开始时间'];if(key==='notes')delete fields['更新时间'];const bytes=await globalThis.crypto.subtle.digest('SHA-256',new TextEncoder().encode(key+JSON.stringify(stable(fields))));return Array.from(new Uint8Array(bytes),v=>v.toString(16).padStart(2,'0')).join('');}

  const headers={Accept:'application/json'};if(body!==undefined&&!raw)headers['Content-Type']='application/json';

   catch(e){if(attempt+1>=(retry?2:1)){const error=Error(e.name==='AbortError'?'网络请求超时，请保留草稿后重试':'暂时无法连接云端，内容草稿仍保留在此设备');error.network=true;throw error;}}

  }

 }
 const db={
  kind:'sites',taskFields:['最后期限','预计时长','允许并行'],capabilities:{taskFields:['最后期限','预计时长','允许并行'],atomicVersion:true,cloud:true},
  session:()=>request('/session'),
  async query({databaseId,pageSize=200,startCursor}={}){const params=new URLSearchParams({limit:String(Math.max(1,Math.min(200,pageSize)))});if(startCursor)params.set('cursor',startCursor);return request('/records/'+table(databaseId)+'?'+params);},
  async getRecord({databaseId,recordId}){return (await request('/records/'+table(databaseId)+'/'+encodeURIComponent(recordId))).record;},
  async getPendingCreate({databaseId,properties}){const key=await creationKey(table(databaseId),properties),identity=pendingCreates.get(key)||[...pendingCreates.values()].find(value=>value.intentKey===key);return identity?.properties?JSON.parse(JSON.stringify({requestId:identity.requestId,recordId:identity.recordId,properties:identity.properties})):null;},
  async addRecord({databaseId,properties,intentProperties}){
   const key=await creationKey(table(databaseId),properties);let identity=pendingCreates.get(key);

   // acknowledged-operation shape, without introducing a server schema field.
   try{const result=await mutate('/records/'+table(databaseId),{requestId:identity.requestId,recordId:identity.recordId,properties:identity.properties||properties});pendingCreates.delete(key);persistPending();return result.record;}
   catch(e){if(e.network||e.status>=500)e.message+='。新增结果尚未确认，刷新核对后可再次提交同一内容，系统会使用同一请求避免重复创建';else if(e.status===400){pendingCreates.delete(key);persistPending();}throw e;}
  },
  async updateRecord({databaseId,recordId,properties,expectedVersion}){if(!Number.isInteger(expectedVersion))throw Error('缺少记录版本，请刷新后再保存；草稿已保留');return (await mutate('/records/'+table(databaseId)+'/'+encodeURIComponent(recordId),{properties,expectedVersion},'PATCH')).record;},
  async deleteRecord({databaseId,recordId,expectedVersion}){if(!Number.isInteger(expectedVersion))throw Error('缺少记录版本，请刷新后再操作');return mutate('/records/'+table(databaseId)+'/'+encodeURIComponent(recordId),{expectedVersion},'DELETE');},

  async uploadImage(args){return db.uploadFile(args);},
  async uploadFile({file,owner}){if(!file)throw Error('请选择附件');if(file.size>20*1024*1024)throw Error('单个附件请不超过 20 MB');const form=new FormData();form.append('file',file,file.name||'附件');if(owner)form.append('owner',JSON.stringify(owner));const result=await request('/files',{method:'POST',body:form,raw:true,retry:false});changed();return result;},
  exportBackup,
  async checkRevision(){const {revision}=await request('/revision');pendingRevision=String(revision);return invalidated||acknowledgedRevision!==pendingRevision;},
  didRead(revision=pendingRevision){acknowledgedRevision=revision;invalidated=false;},
  snapshotVersion:async()=>String((await request('/revision')).revision),
  onUpdated(fn){listeners.push(fn);return()=>{const i=listeners.indexOf(fn);if(i>=0)listeners.splice(i,1);};},
  async previewImport(backup){const incoming=validateBackup(backup),current=await db.exportBackup();let added=0,skipped=0;const conflicts=[];const counts={};for(const key of KEYS){const existing=new Map((current.tables?.[key]||[]).map(r=>[idOf(r),r]));counts[key]=incoming.tables[key].length;for(const row of incoming.tables[key]){const old=existing.get(idOf(row));if(!old)added++;else if(canonical(old)===canonical(row))skipped++;else conflicts.push({table:key,id:idOf(row),title:row['任务标题']||row['便签内容']?.slice(0,50)||idOf(row)});}}return {...incoming,added,skipped,conflicts,counts,attachmentCount:Array.isArray(backup.attachments)?backup.attachments.length:0};},
  async importBackup(backup,onProgress=()=>{}){const prepared=await db.previewImport(backup);if(prepared.conflicts.length)throw Error('发现 '+prepared.conflicts.length+' 条同 ID 不同内容的记录，已停止导入，云端原记录未覆盖');const rows=[];for(const key of KEYS)for(const row of prepared.tables[key])rows.push({key,row});let imported=0,skipped=0;const encoder=new TextEncoder();for(let i=0;i<rows.length;){const tables={};let end=i,bytes=1024;while(end<rows.length&&end-i<100){const {key,row}=rows[end],size=encoder.encode(JSON.stringify(row)).length+32;if(end>i&&bytes+size>6*1024*1024)break;if(size>6*1024*1024)throw Error('记录 '+idOf(row)+' 过大，已停止导入；此前确认导入的记录仍保留');bytes+=size;(tables[key]||=[]).push(row);end++;}try{const r=await mutate('/import',{tables});imported+=r.imported||0;skipped+=r.skipped||0;onProgress({done:end,total:rows.length,imported,skipped});}catch(e){e.message='导入停在 '+i+'/'+rows.length+' 条：'+e.message+'。已导入内容保留，可重新选择同一备份继续。';throw e;}i=end;}return {imported,skipped,total:rows.length};}

});

  start=C.plusDays(anchor,-weekday);end=C.plusDays(start,6);previous=C.plusDays(start,-7);next=C.plusDays(start,7);label=start+' — '+end;
 }else{
  const months=period==='month'?1:period==='quarter'?3:period==='half'?6:12;
  const first=period==='year'?1:Math.floor((month-1)/months)*months+1;
  start=year+'-'+String(first).padStart(2,'0')+'-01';
  const after=new Date(Date.UTC(year,first-1+months,1)),before=new Date(Date.UTC(year,first-1-months,1));
  next=after.toISOString().slice(0,10);previous=before.toISOString().slice(0,10);end=C.plusDays(next,-1);
  label=period==='month'?year+'年'+month+'月':period==='quarter'?year+'年第'+(Math.floor((month-1)/3)+1)+'季度':period==='half'?year+'年'+(first===1?'上半年':'下半年'):year+'年';
 }
 const endExclusive=C.plusDays(end,1);
 return {period,start,end,endExclusive,from:dayStamp(start),to:dayStamp(endExclusive),previousAnchor:previous,nextAnchor:next,label,title:PERIODS[period]};
}

function buildReport(data,range,now=Date.now()){
 const inRange=time=>Number.isFinite(time)&&time>=range.from&&time<range.to&&time<=now;
 const notes=data.notes.map(note=>{
  const created=C.stamp(note['创建时间']),modified=C.stamp(note['更新时间']);
  const at=Number.isFinite(modified)?modified:created;
  return {id:C.id(note),note,taskId:note['关联任务ID']||'',body:note['便签内容']||'',category:note['便签分类']||'记录',at,date:Number.isFinite(at)?chinaDay(at):'',updated:at!==created};
 }).filter(note=>inRange(note.at)).sort((a,b)=>b.at-a.at);
 const notesByTask=new Map(),tagsByTask=new Map();
 for(const note of notes)if(note.taskId){if(!notesByTask.has(note.taskId))notesByTask.set(note.taskId,[]);notesByTask.get(note.taskId).push(note);}
 for(const link of data.links){const id=link['任务ID'],tag=link['标签名称'];if(!tag)continue;if(!tagsByTask.has(id))tagsByTask.set(id,new Set());tagsByTask.get(id).add(tag);}
 let intervals=[],totalMs=0;
 const today=chinaDay(now),rows=data.tasks.map(task=>{
  const id=C.id(task),status=task['任务状态']||C.STATUS[0],trashed=!!task['回收站'];
  const deleted=C.stamp(task['删除时间']),time=C.taskTime(task,data.logs,trashed&&Number.isFinite(deleted)?Math.min(now,deleted):now,[range.from,range.to]);
  const created=C.stamp(task['创建时间']),changed=C.stamp(task['状态开始时间']);
  const completedAt=status==='完成'?C.stamp(task['状态结束时间']||task['状态开始时间']):NaN,completedInRange=inRange(completedAt);
  const linked=notesByTask.get(id)||[],createdInRange=inRange(created),statusChangedInRange=inRange(changed);
  const a=C.day(task['计划开始时间']||task['计划截止时间']),b=C.day(task['计划截止时间']||task['计划开始时间']);
  const plannedInRange=!!a&&a<=range.end&&b>=range.start;
  const active=time.doing>0||linked.length>0||completedInRange||createdInRange||statusChangedInRange;
  const row={id,task,title:task['任务标题']||'未命名记录',status,trashed,ms:time.doing,notes:linked,tags:[...(tagsByTask.get(id)||[])],completedAt,completedDate:Number.isFinite(completedAt)?chinaDay(completedAt):'',completedInRange,created,createdInRange,changed,statusChangedInRange,plannedInRange,active,deadlineDate:C.day(task['最后期限']||task['计划截止时间']),issues:time.issues};
  intervals.push(...time.intervals);totalMs+=time.doing;return row;
 });
 const merged=C.merge(intervals),uniqueMs=merged.reduce((sum,[a,b])=>sum+b-a,0),active=rows.filter(row=>row.active);
 const completed=rows.filter(row=>row.completedInRange).sort((a,b)=>b.completedAt-a.completedAt);
 const byEffort=(a,b)=>b.ms-a.ms||b.notes.length-a.notes.length||a.title.localeCompare(b.title,'zh-CN');
 const progress=rows.filter(row=>!row.trashed&&(row.active||row.plannedInRange)&&['进行中','暂停'].includes(row.status)).sort(byEffort);
 const pending=rows.filter(row=>!row.trashed&&(row.active||row.plannedInRange)&&row.status===C.STATUS[0]).sort(byEffort);
 const ended=rows.filter(row=>row.status===C.STATUS[4]&&row.statusChangedInRange);
 const otherActivity=active.filter(row=>!row.completedInRange&&C.terminal(row.status)&&(row.ms>0||row.notes.length>0)&&!(row.status===C.STATUS[4]&&row.statusChangedInRange)).sort(byEffort);
 const risks=rows.filter(row=>!row.trashed&&!C.terminal(row.status)&&(row.active||row.plannedInRange)&&row.deadlineDate&&row.deadlineDate<today).sort((a,b)=>a.deadlineDate.localeCompare(b.deadlineDate));
 const nextStart=range.endExclusive,nextEnd=C.plusDays(nextStart,6);
 const upcoming=rows.filter(row=>{const date=C.day(row.task['计划开始时间'])||row.deadlineDate;return !row.trashed&&!C.terminal(row.status)&&date>=nextStart&&date<=nextEnd;}).sort((a,b)=>String(a.task['计划开始时间']||a.deadlineDate).localeCompare(String(b.task['计划开始时间']||b.deadlineDate)));
 const activityDates=new Set();
 for(const note of notes)activityDates.add(note.date);
 for(const row of active){if(row.createdInRange)activityDates.add(chinaDay(row.created));if(row.statusChangedInRange)activityDates.add(chinaDay(row.changed));if(row.completedInRange)activityDates.add(row.completedDate);}
 const trend=[];
 for(let date=range.start;date<=range.end;date=C.plusDays(date,1)){
  const a=dayStamp(date),b=a+DAY,ms=merged.reduce((sum,[start,end])=>sum+Math.max(0,Math.min(end,b)-Math.max(start,a)),0);
  if(ms>0)activityDates.add(date);
  trend.push({date,ms,completed:completed.filter(row=>row.completedDate===date).length,notes:notes.filter(note=>note.date===date).length,active:activityDates.has(date)});
 }
 const tagMap=new Map(),categoryMap=new Map();
 for(const row of active)for(const name of row.tags.length?row.tags:['未加标签']){const tag=tagMap.get(name)||{name,count:0,ms:0};tag.count++;tag.ms+=row.ms;tagMap.set(name,tag);}
 for(const note of notes){const category=categoryMap.get(note.category)||{name:note.category,count:0};category.count++;categoryMap.set(note.category,category);}
 return {range,now,today,rows,active,completed,progress,pending,ended,otherActivity,risks,upcoming,nextStart,nextEnd,notes,trend,uniqueMs,totalMs,overlapMs:Math.max(0,totalMs-uniqueMs),taskCount:active.length,completedCount:completed.length,activeDays:activityDates.size,noteCount:notes.length,createdCount:rows.filter(row=>row.createdInRange).length,unloggedCompleted:completed.filter(row=>!row.ms).length,tags:[...tagMap.values()].sort((a,b)=>b.ms-a.ms||b.count-a.count),categories:[...categoryMap.values()].sort((a,b)=>b.count-a.count),issues:active.filter(row=>row.issues.length),hasActivity:active.length>0||notes.length>0};
}

function reportMarkdown(report){
 const {range}=report;
 const detail=row=>row.title+(row.trashed?'（已移入回收站，保留历史）':'')+(row.tags.length?' · '+row.tags.map(tag=>'#'+tag).join(' '):'')+'；'+(row.ms?'本期执行 '+C.duration(row.ms):'未记录执行时长');
 const lines=['# '+(range.period==='week'?range.start+' — '+range.end:range.label)+' · '+range.title,'','统计区间：'+range.start+' 至 '+range.end+'（北京时间 UTC+08:00）','','## 本期概览','',
  '- 可确认完成：'+report.completedCount+' 项（按当前完成状态及实际完成时间）。',
  '- 有活动的任务：'+report.taskCount+' 项；新建 '+report.createdCount+' 项；新增或更新记录 '+report.noteCount+' 条。',
  '- 记录的执行用时：'+C.duration(report.uniqueMs)+'，跨任务及父子任务重叠已去重。',
  '- 有活动的日期：'+report.activeDays+' 天（含执行、创建、状态变化或记录更新）。'];
 if(report.overlapMs)lines.push('- 各任务累计 '+C.duration(report.totalMs)+'，其中并行重叠 '+C.duration(report.overlapMs)+'。');
 if(!report.uniqueMs)lines.push('- 本期没有记录到执行时段；计划时长未当作实际工时。');
 lines.push('','## 已完成','');
 if(report.completed.length)for(const row of report.completed)lines.push('- '+detail(row)+'；完成于 '+row.completedDate+'。');
 else lines.push('- 本期没有可确认的完成记录。');
 lines.push('','## 推进中与待跟进','');
 if(report.progress.length)for(const row of report.progress)lines.push('- '+detail(row)+'；当前'+(row.status==='暂停'?'已暂停':'进行中')+'。');
 else lines.push('- 本期没有记录到当前进行中或暂停的任务。');
 if(report.pending.length){lines.push('','### 待开始 / 本期计划','');for(const row of report.pending)lines.push('- '+row.title+'；'+(row.task['计划开始时间']?'计划 '+C.day(row.task['计划开始时间']):'尚未安排时间')+'。');}
 if(report.otherActivity.length){lines.push('','### 其他有投入的任务','');for(const row of report.otherActivity)lines.push('- '+detail(row)+'；当前'+(row.status==='完成'?'已完成（完成时间不在本期）':'已结束但未完成')+(row.completedDate?'，完成于 '+row.completedDate:'')+'。');}
 if(report.ended.length){lines.push('','### 已结束但未完成','');for(const row of report.ended)lines.push('- '+detail(row)+'。');}
 lines.push('','## 工作记录摘录','');
 if(report.notes.length)for(const note of report.notes){const row=report.rows.find(row=>row.id===note.taskId);lines.push('### '+note.date+' · '+note.category+(note.updated?'（本期更新）':'')+(row?' · '+row.title:''),'',...note.body.split('\n').map(line=>'> '+line),'');}
 else lines.push('- 本期没有新增或更新的文字记录。');
 lines.push('','## 风险与待确认（截至 '+report.today+'）','');
 if(report.risks.length)for(const row of report.risks)lines.push('- '+row.title+'：原截止 '+row.deadlineDate+'，当前仍未完成；请核对进展或调整计划。');
 else lines.push('- 根据当前记录，未发现本期相关任务已经逾期且仍未完成；其他风险需自行补充。');
 lines.push('','## 下一步（按已有安排）','','范围：'+report.nextStart+' 至 '+report.nextEnd+'；计划不代表已经完成。','');
 if(report.upcoming.length)for(const row of report.upcoming)lines.push('- '+(C.day(row.task['计划开始时间'])||row.deadlineDate)+' · '+row.title+'。');
 else lines.push('- 这段时间尚无已安排且未完成的任务，请补充下一步。');
 lines.push('','## 补充总结','','（可补充业务成果、关键结论、协作反馈和需要支持的事项。）','','---','统计说明：只汇总已有任务、时间日志及文字记录。执行时间取「进行中」区间并去重，不将计划时长计为实际投入。当前状态不能完整还原历史时点；已完成后又重新打开的任务不推测为历史完成。已删除任务的已有活动保留并标注。');
 return lines.join('\n').replace(/\n{3,}/g,'\n\n');
}

 'unscheduled-toggle':()=>{UI.unscheduled=!UI.unscheduled;L.render();},'show-unscheduled':()=>{UI.filter='unscheduled';view('board');},
 'plan-today':el=>L.run(async()=>{const t=L.find(el.dataset.id);await L.store.patch('tasks',C.id(t),{'计划开始时间':{date:UI.date+'T00:00:00Z'},'计划截止时间':{date:UI.date+'T23:59:00Z'}},t);L.toast('已安排到 '+UI.date);},el),
 'board-jump':el=>{UI.boardColumn=Number(el.dataset.column);const node=document.querySelectorAll('.board-col')[UI.boardColumn];node?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});},
 'task-more':el=>L.taskMore(el.dataset.id),'notes-filter':el=>{const i=L.recordCategories().findIndex(x=>x[0]===el.dataset.value);if(L.workspaceSwipe&&UI.tab==='notes')L.workspaceSwipe.go(i);else{UI.noteFilter=el.dataset.value;L.render();}},'note-more':el=>L.noteMore(el.dataset.id),'convert-note':el=>L.convertNote(el.dataset.id),
 filters:()=>L.openFilters(),'reset-filter':()=>{UI.filter='all';UI.priority='';UI.tag='';L.render();},
 stats:()=>view('stats'),search:()=>L.openSearch(),settings:()=>L.openSettings(),refresh:()=>refresh(),help:()=>L.openHelp()
};L.actions=actions;
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled||el.closest('[inert]'))return;if(el.matches('.record-card')&&e.target.closest('a,button,input,select,textarea'))return;const fn=actions[el.dataset.act];if(fn){e.preventDefault();Promise.resolve(fn(el,e)).catch(L.handleError);}});
document.addEventListener('change',e=>{if(e.target.id==='calendarMode'){UI.calendar=e.target.value;L.save('calendar',UI.calendar);L.render();}});
$('captureInput').value=L.read('capture.task','');$('captureInput').addEventListener('input',()=>{L.save('capture.'+UI.captureKind,$('captureInput').value);L.paintCapture();});$('captureForm').addEventListener('submit',submitCapture);
$('captureInput').addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key==='Enter'&&!e.shiftKey&&(UI.captureKind==='task'||e.ctrlKey||e.metaKey)){e.preventDefault();submitCapture();}});
document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.isComposing)return;if((e.key==='Enter'||e.key===' ')&&e.target.matches('.record-card[role=button]')){e.preventDefault();actions[e.target.dataset.act]?.(e.target);return;}const top=L.modalStack.at(-1),root=top?.root||L.detail?.element;if(e.key==='Escape'){if(top){e.preventDefault();top.close();}else if(L.detail){e.preventDefault();L.closeDetail();}return;}if(e.key==='Tab'&&root){const nodes=[...root.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(n=>!n.closest('[hidden],[inert]')&&n.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||!root.contains(document.activeElement))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||!root.contains(document.activeElement))){e.preventDefault();first?.focus();}return;}
 const typing=e.target.matches('input,textarea,select')||e.target.isContentEditable;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!top&&!L.detail){e.preventDefault();L.openSearch();return;}if(typing||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='/'||k==='+'){if(!e.repeat&&(top?.createRecord||(!top&&!L.detail))){e.preventDefault();actions['global-create']();}return;}if(top||L.detail)return;if(k==='c')view('calendar');if(k==='b')view('board');if(k==='?')L.openHelp();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=gridcell]')){e.preventDefault();actions.day(e.target);}});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag-id]');if(!el)return;const t=L.find(el.dataset.dragId);if(!t)return;drag={id:C.id(t),base:JSON.parse(JSON.stringify(t))};e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move';el.classList.add('dragging');});
document.addEventListener('dragover',e=>{const target=e.target.closest('[data-drop-status],[data-drop-day],.day[data-date]');if(!drag||!target)return;e.preventDefault();document.querySelectorAll('.drop-over').forEach(n=>{if(n!==target)n.classList.remove('drop-over');});target.classList.add('drop-over');});
document.addEventListener('drop',e=>{const target=e.target.closest('[data-drop-status],[data-drop-day],.day[data-date]');if(!drag||!target)return;e.preventDefault();const current=drag;drag=null;if(target.dataset.dropStatus){if(target.dataset.dropStatus!==current.base['任务状态'])L.changeStatus(current.id,target.dataset.dropStatus);}else{const date=target.dataset.dropDay||target.dataset.date;L.run(async()=>{const saved=await L.saveTaskSchedule(current.id,C.movePlan(current.base,date),current.base);if(saved)L.toast('计划已移到 '+date+' · '+L.planText(saved));});}document.querySelectorAll('.drop-over,.dragging').forEach(n=>n.classList.remove('drop-over','dragging'));});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.drop-over,.dragging').forEach(n=>n.classList.remove('drop-over','dragging'));});
function connect(){if(unsub)unsub();L.store=window.OneDayLiteStore.createStore(sdk);unsub=L.store.subscribe(()=>{L.paintSync();L.paintCapture();L.scheduleRender();});if(sdk)L.store.connectUpdates(()=>L.debounce('host-refresh',()=>refresh(true),450));L.render();L.paintSync();L.paintCapture();if(sdk)refresh(true);}
connect();if(!sdk){let tries=0;const wait=setInterval(()=>{sdk=window.__SMART_PAGE__?.database;if(sdk){clearInterval(wait);connect();}else if(++tries>=20)clearInterval(wait);},500);}
window.addEventListener('focus',()=>{if(sdk&&Date.now()-L.store.state.lastRead>15000)refresh(true);});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){L.paintTimes();if(sdk)refresh(true);}else L.flushDrafts?.();});window.addEventListener('online',()=>refresh(true));window.addEventListener('offline',()=>{if(window.__ONEDAY_SITES__){L.store.state.readError='当前离线，输入草稿保留在本设备；联网后请确认保存';L.flushDrafts?.();L.paintSync();}});window.addEventListener('pagehide',()=>L.flushDrafts?.());
setInterval(()=>{if(document.visibilityState==='visible'){L.paintTimes();if(L.store.state.pending&&Date.now()-L.store.state.pendingSince>30000){$('syncLabel').textContent='仍在保存';$('syncButton').title='服务端尚未确认，请勿重复提交。输入草稿保留在本机。';}}},1000);
setInterval(()=>{if(sdk&&document.visibilityState==='visible')refresh(true);},window.__ONEDAY_SITES__?15000:60000);
window.addEventListener('beforeunload',e=>{L.flushDrafts?.();if(L.store.state.pending||L.detail?.session.dirty||L.hasUnsavedChanges?.()){e.preventDefault();e.returnValue='';}});
})();
