      if (mask.__close) {
        mask.__close();
        if (agScope && agScope.parentNode) { renderAgenda(); }   /* 焦点回到当日议程 */
      } else { closeModal(); }
    }

    /* —— 日期选择器 —— */
    function dpLabel() {
      var el = $('crDtLabel');
      if (el) el.textContent = dpDs + (dpDs === todayDs ? ' · 今天' : '');
    }
    function dpRender() {
      var my = Number(dpMonth.slice(0, 4)), mm = Number(dpMonth.slice(5, 7));
      var firstDow = new Date(my, mm - 1, 1).getDay();
      var days = new Date(my, mm, 0).getDate();
      var lead = '', d;
      for (d = 0; d < firstDow; d++) { lead += '<span class="dtblank"></span>'; }
      var cells = '';
      for (d = 1; d <= days; d++) {
        var ds = my + '-' + pad(mm) + '-' + pad(d);
        cells += '<button type="button" class="dtcell' +
          (ds === dpDs ? ' sel' : '') + (ds === todayDs ? ' today' : '') +
          '" data-dtcell="' + ds + '">' + d + '</button>';
      }
      var grid = $('crDtGrid'); if (grid) { grid.innerHTML = lead + cells; }
      var mEl = $('crDtMonth'); if (mEl) { mEl.textContent = my + ' 年 ' + mm + ' 月'; }
    }
    function dpPick(ds) {
      dpDs = ds; dpMonth = ds.slice(0, 7) + '-01';
      dpLabel(); dpRender();
      var pop = $('crDtPop'); if (pop) pop.style.display = 'none';
    }
    function dpStep(dir) {
      var my = Number(dpMonth.slice(0, 4)), mm = Number(dpMonth.slice(5, 7)) + dir;
      if (mm < 1) { mm = 12; my--; }
      if (mm > 12) { mm = 1; my++; }
      dpMonth = my + '-' + pad(mm) + '-01';
      dpRender();
    }
    function applyKind() {
      var isNote = kind === 'note';
      var tb = $('crTaskBlk'); if (tb) tb.style.display = isNote ? 'none' : 'block';
      var nb = $('crNoteBlk'); if (nb) nb.style.display = isNote ? 'block' : 'none';
      var tl = $('crTitleLb'); if (tl) tl.textContent = isNote ? '便签内容' : '任务标题';
      var ti = $('fTitle'); if (ti) ti.setAttribute('placeholder', isNote ? '随手记点什么…' : '要做什么？');
      var dl = $('crDetailLb');
      if (dl) dl.innerHTML = isNote ? '补充（选填） <span class="hint">会追加到便签内容</span>'
                                   : '任务详情 <span class="hint">支持 Markdown，可留空</span>';
      var sb = $('fSave'); if (sb) sb.textContent = isNote ? '保存为便签' : '创建任务';
      var wrap = $('crKind');
      if (wrap) {
        var bs = wrap.querySelectorAll('button');
        for (var i = 0; i < bs.length; i++) { bs[i].className = (bs[i].getAttribute('data-crk') === kind) ? 'on' : ''; }
      }
      if (isNote) { var pop = $('crDtPop'); if (pop) pop.style.display = 'none'; }
    }
    applyKind(); dpLabel(); dpRender();
    if (kind === 'task') { var pop0 = $('crDtPop'); if (pop0) pop0.style.display = 'none'; }

    setTimeout(function () { var ti = $('fTitle'); if (ti) { ti.focus(); ti.select(); } }, 30);

    mask.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-close')) { closeSelf(); return; }
      if (b.hasAttribute('data-crk')) { if (parent) return; kind = b.getAttribute('data-crk'); applyKind(); return; }
      if (b.id === 'crDtTrigger') {
        var pop = $('crDtPop');
        if (pop) pop.style.display = (pop.style.display === 'none' ? 'block' : 'none');
        return;
      }
      if (b.hasAttribute('data-dtstep')) { dpStep(Number(b.getAttribute('data-dtstep'))); return; }
      if (b.id === 'crDtToday') { dpPick(todayDs); return; }
      if (b.hasAttribute('data-dtcell')) { dpPick(b.getAttribute('data-dtcell')); return; }
      if (b.id === 'fSave') { doSave(); return; }
    });
    mask.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doSave(); return; }
      if (e.key === 'Enter' && e.target && e.target.id === 'fTitle') { e.preventDefault(); doSave(); }
    });

    function doSave() {
      var txt = ($('fTitle').value || '').trim();
      var detail = $('fDetail') ? ($('fDetail').value || '').trim() : '';
      var btn = $('fSave');
      if (kind === 'note') {
        if (!txt) { toast('写点什么再保存吧'); if ($('fTitle')) $('fTitle').focus(); return; }
        var content = txt + (detail ? '\n' + detail : '');
        var tid = $('crNoteTask') ? $('crNoteTask').value : '';
        var tt = tid ? byId(tid) : null;
        if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
        addNote({
          '便签内容': { text: content },
          '便签分类': { select: $('crNoteCat') ? $('crNoteCat').value : '记录' },
          '关联任务ID': { text: tid || '' },
          '关联任务标题': { text: tt ? (tt['任务标题'] || '') : '' },
          '便签状态': { select: tid ? '已关联' : '未处理' },
          '置顶': { checkbox: false },
          '来源': { text: '快速便签' },
          '创建时间': { date: nowISO() }, '更新时间': { date: nowISO() }
        }, function (err) {
          if (err) { toast('保存失败'); if (btn) { btn.disabled = false; btn.textContent = '保存为便签'; } return; }
          clearDraft(); toast('已保存便签'); closeSelf(); reload();
        });
        return;
      }
      /* 任务 */
      if (!txt) { toast('请填写任务标题'); if ($('fTitle')) $('fTitle').focus(); return; }
      if (btn) { btn.disabled = true; btn.textContent = '创建中…'; }
      var p = { '任务标题': { text: txt } };
      if (detail) { p['任务详情'] = { text: detail }; }
      p['任务类型'] = { select: parentId ? '子任务' : '主任务' };
      if (parentId) { p['父任务ID'] = { text: parentId }; }
      if (timeMode) {
        p['计划开始时间'] = { date: minToISO(dpDs, tStart) };
        p['计划截止时间'] = { date: minToISO(dpDs, tEnd) };
      } else {
        p['计划开始时间'] = { date: dpDs + 'T00:00:00Z' };
        p['计划截止时间'] = { date: dpDs + 'T23:59:00Z' };
      }
      p['任务状态'] = { select: ST_DEFAULT };
      p['状态开始时间'] = { date: nowISO() };
      p['创建时间'] = { date: nowISO() };
      addTask(p, function (err, rec) {
        if (err) {
          console.error('[新建] 写入被拒：', err, p);
          toast('创建失败：' + describeErr(err), 3600);
          if (btn) { btn.disabled = false; btn.textContent = '创建任务'; }
          return;
        }
        var nid = rid(rec);
        var mk = function (tid) {
          addLog({
            '日志标题': { text: txt + ' · ' + ST_DEFAULT },
            '任务ID': { text: tid || '' }, '任务标题': { text: txt },
            '任务类型': { select: parentId ? '子任务' : '主任务' },
            '状态': { select: ST_DEFAULT }, '开始时间': { date: p['状态开始时间'].date }
          }, function (logErr) {
            clearDraft(); toast(logErr?'任务已创建，但初始日志保存失败，请在详情里补记。':'任务已创建 · '+dpDs,logErr?6000:2000); closeSelf();
            reload(function () {
              if (agScope && agScope.parentNode) { renderAgenda(); }
              else if (backAgenda) { openDayAgenda(backAgenda); }
            });
          });
        };
        if (nid) { mk(nid); return; }
        reload(function () {
          var best = null;
          for (var i = 0; i < S.tasks.length; i++) {
            var tk = S.tasks[i];
            if (tk['任务标题'] !== txt) { continue; }
            if (!best || String(tk['创建时间'] || '') > String(best['创建时间'] || '')) { best = tk; }
          }
          mk(best ? best['_id'] : '');
        });
      });
    }
    if (kind === 'task') { setTimeout(function () { var el = $('crDtLabel'); if (el) el.textContent = dpDs + (dpDs === todayDs ? ' · 今天' : ''); }, 0); }
  }

  /* ---------- 11.2 新建任务（极简录入：只填标题与详情） ----------
     设计取舍：新建只收「任务标题 + 任务详情」两件事，状态固定落在「收集（未开始）」、
     优先级留空。计划时间/优先级/标签/图标/子任务/附件等一律创建后在任务详情里二次配置，
     避免新建时被一堆字段拦住。 */
  function openTaskForm(id, presetParent, opts) {
    if (!dbReady) { toast('数据服务尚未就绪，请刷新页面后重试', 2600); return; }
    opts = opts || {};
    var insOrder = (S.pendingOrder !== null && S.pendingOrder !== undefined) ? S.pendingOrder : null;
    S.pendingOrder = null;
    var backAgenda = opts.agenda || '';
    var presetDate = opts.date || '';

    var sel = S.selId ? byId(S.selId) : null;
    var parentId = presetParent || (sel && sel['任务类型'] !== '子任务' ? sel['_id'] : '');
    var parent = parentId ? byId(parentId) : null;
    if (!parent) { parentId = ''; }

    /* 在看板某一列里插入时，新任务应直接落在该列对应的状态 / 优先级上 */
    var useSt = ST_DEFAULT, si;
    if (opts.status) {
      for (si = 0; si < STATUSES.length; si++) { if (STATUSES[si].n === opts.status) { useSt = STATUSES[si].n; } }
    }
    var usePr = '', pi;
    if (opts.prio) {
      for (pi = 0; pi < PRIOS.length; pi++) { if (PRIOS[pi].n === opts.prio) { usePr = PRIOS[pi].n; } }
    }

    var ctx = '';
    if (parent) {
      ctx += '<div class="notice" style="margin-bottom:12px">作为主任务「' + esc(parent['任务标题']) + '」的子任务创建</div>';
    }
    if (presetDate) {
      ctx += '<div class="notice" style="margin-bottom:12px">计划时间自动设为 ' + esc(presetDate) + '</div>';
    }

    var metaBits = '<span class="badge" style="color:' + stMeta(useSt).c + ';background:' + stMeta(useSt).bg +
      ';border-color:' + stMeta(useSt).bd + '">' + stMeta(useSt).ic + ' ' + esc(stMeta(useSt).n) + '</span>';
    if (usePr) {
      metaBits += '<span class="badge" style="color:' + prMeta(usePr).c + ';background:' + prMeta(usePr).bg +
        ';border-color:' + prMeta(usePr).bg + '">' + prMeta(usePr).ic + ' ' + esc(usePr) + '</span>';
    }

    var body = ctx +
      '<div class="fld quick"><label>任务标题</label>' +
      '<input type="text" id="fTitle" autocomplete="off" placeholder="要做什么？"></div>' +
      '<div class="fld quick"><label>任务详情 <span class="hint">支持 Markdown，可留空</span></label>' +
      '<textarea id="fDetail" rows="7" placeholder="补充说明、拆解步骤、验收标准… 写一两句也行"></textarea></div>' +
      '<div class="quick-meta">' + metaBits +
      '<span>建好后在任务详情里继续配计划时间、标签、图标、子任务。</span></div>';

    var foot = '<button class="btn-ghost" data-close="1">取消</button>' +
      '<div class="grow"></div><span class="hint">⌘/Ctrl + Enter 创建</span>' +
      '<button class="btn-primary" id="fSave">创建任务</button>';

    var mask = modal({ title: parent ? '新建子任务' : '新建任务', cls: 'w620', body: body, foot: foot });

    setTimeout(function () { var ti = $('fTitle'); if (ti) { ti.focus(); ti.select(); } }, 30);

    mask.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-close')) { closeModal(); return; }
      if (b.id === 'fSave') { doSave(); }
    });
    mask.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doSave(); return; }
      if (e.key === 'Enter' && e.target && e.target.id === 'fTitle') { e.preventDefault(); doSave(); }
    });

    var d = readDraft();
    if (d) {
      if (d.title && $('fTitle') && !$('fTitle').value) { $('fTitle').value = d.title; }
      if (d.detail && $('fDetail') && !$('fDetail').value) { $('fDetail').value = d.detail; }
    }
    var keep = function () {
      if (draftTimer) clearTimeout(draftTimer);
      draftTimer = setTimeout(function () {
        saveDraft({ title: $('fTitle') ? $('fTitle').value : '', detail: $('fDetail') ? $('fDetail').value : '' });
      }, 300);
    };
    ['fTitle', 'fDetail'].forEach(function (n) { var el = $(n); if (el) el.addEventListener('input', keep); });

    /** 组装载荷；minimal=true 时只带标题/状态/时间，用于失败后的降级重试 */
    function payload(orderIdx, minimal) {
      var title = ($('fTitle').value || '').trim();
      var p = { '任务标题': { text: title } };
      if (!minimal) {
        var detail = ($('fDetail').value || '').trim();
        if (detail) { p['任务详情'] = { text: detail }; }
        p['任务类型'] = { select: parentId ? '子任务' : '主任务' };
        if (parentId) { p['父任务ID'] = { text: parentId }; }
        if (orderIdx !== null && orderIdx !== undefined) { p['排序序号'] = { number: orderIdx }; }
        if (usePr) { p['优先级'] = { select: usePr }; }
        if (presetDate) {
          p['计划开始时间'] = { date: presetDate + 'T00:00:00Z' };
          p['计划截止时间'] = { date: presetDate + 'T23:59:00Z' };
        }
      }
      p['任务状态'] = { select: useSt };
      p['状态开始时间'] = { date: nowISO() };
      p['创建时间'] = { date: nowISO() };
      return p;
    }

    function finish(rec) {
      var title = ($('fTitle').value || '').trim();
      var nid = rid(rec);
      var mk = function (tid) {
        addLog({
          '日志标题': { text: title + ' · ' + useSt },
          '任务ID': { text: tid || '' }, '任务标题': { text: title },
          '任务类型': { select: parentId ? '子任务' : '主任务' },
          '状态': { select: useSt }, '开始时间': { date: nowISO() }
        }, function (logErr) {
          clearDraft();
          toast(logErr?'任务已创建，但初始日志保存失败，请在详情里补记。':'任务已创建',logErr?6000:2000);
          closeModal();
          reload(function () { if (backAgenda) { openDayAgenda(backAgenda); } });
        });
      };
      if (nid) { mk(nid); return; }
      reload(function () {
        var best = null;
        for (var i = 0; i < S.tasks.length; i++) {
          var tk = S.tasks[i];
          if (tk['任务标题'] !== title) { continue; }
          if (!best || String(tk['创建时间'] || '') > String(best['创建时间'] || '')) { best = tk; }
        }
        mk(best ? best['_id'] : '');
      });
    }

    function doSave() {
      var title = ($('fTitle').value || '').trim();
      if (!title) { toast('请填写任务标题'); if ($('fTitle')) { $('fTitle').focus(); } return; }
      var btn = $('fSave');
      if (btn) { btn.disabled = true; btn.textContent = '创建中…'; }
      var props = payload(insOrder, false);

      addTask(props, function (err, rec) {
        if (!err) { finish(rec); return; }
        if(btn){btn.disabled=false;btn.textContent='创建任务';}
        toast('创建请求失败，未自动重试。请先重新读取并确认是否已创建，再决定是否重试。'+describeErr(err),6500);
      });
    }
  }

  /* ---------- 11.3 标签管理 ---------- */
  function openTagManager() {
    var counts = {};
    for (var i = 0; i < S.links.length; i++) {
      var n = S.links[i]['标签名称'];
      counts[n] = (counts[n] || 0) + 1;
    }
    var h = '<div class="fld"><label>新标签名称</label><input type="text" id="tgName" placeholder="如：会议"></div>';
    h += '<div class="row3">';
    h += '<div class="fld"><label>分类</label><select id="tgCat"><option>工作</option><option>学习</option>' +
         '<option>生活</option><option>健康</option><option>项目</option><option>其他</option></select></div>';
    h += '<div class="fld"><label>颜色</label><select id="tgColor">';
    for (var c in TAG_COLORS) { if (TAG_COLORS.hasOwnProperty(c)) h += '<option>' + c + '</option>'; }
    h += '</select></div>';
    h += '<div class="fld"><label>&nbsp;</label><button class="btn-ghost" id="tgAdd" style="width:100%">+ 新建标签</button></div>';
    h += '</div>';
    h += '<div class="fld"><label>说明（选填）</label><input type="text" id="tgDesc" placeholder="这个标签用来归类什么"></div>';
    h += '<div class="sect"><div class="sect-h">标签库 · ' + S.tags.length + ' 个</div>';
    if (!S.tags.length) h += '<div class="hint">还没有标签。</div>';
    else {
      h += '<table class="tbl"><thead><tr><th>标签</th><th>分类</th><th>颜色</th><th>说明</th>' +
           '<th class="num">关联任务</th><th></th></tr></thead><tbody>';
      for (var j = 0; j < S.tags.length; j++) {
        var t = S.tags[j], pair = TAG_COLORS[t['标签颜色']] || TAG_COLORS['灰'];
        h += '<tr><td><span class="tag" style="color:' + pair[0] + ';background:' + pair[1] + '">' +
          esc(t['标签名称']) + '</span></td><td>' + esc(t['标签分类'] || '—') + '</td>' +
          '<td>' + esc(t['标签颜色'] || '—') + '</td><td>' + esc(t['标签说明'] || '—') + '</td>' +
          '<td class="num">' + (counts[t['标签名称']] || 0) + '</td>' +
          '<td style="white-space:nowrap"><button class="ico-btn" data-tgedit="' + esc(t['_id']) + '" title="编辑">✎</button>' +
          '<button class="ico-btn danger" data-tgdel="' + esc(t['_id']) + '" title="删除">✕</button></td></tr>';
      }
      h += '</tbody></table>';
    }
    h += '</div>';
    var mask = modal({ title: '标签管理', cls: 'w760', body: h, foot: '<button class="btn-ghost" data-close="1">关闭</button>' });

    mask.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-close')) { closeModal(); return; }
      if (b.id === 'tgAdd') {
        var nm = ($('tgName').value || '').trim();
        if (!nm) { toast('请填写标签名称'); return; }
        if (findTag(nm)) { toast('标签「' + nm + '」已存在'); return; }
        addTag({
          '标签名称': { text: nm }, '标签分类': { select: $('tgCat').value },
          '标签颜色': { select: $('tgColor').value }, '标签说明': { text: ($('tgDesc').value || '').trim() },
          '创建时间': { date: nowISO() }
        }, function (err) {
          if (err) { toast('新建失败'); return; }
          toast('已新建标签'); reload(function () { openTagManager(); });
        });
        return;
      }
      if (b.hasAttribute('data-tgedit')) {
        var id = b.getAttribute('data-tgedit'), tg = null;
        for (var i2 = 0; i2 < S.tags.length; i2++) { if (S.tags[i2]['_id'] === id) tg = S.tags[i2]; }
        if (!tg) return;
        var nn = prompt('修改标签名称：', tg['标签名称']);
        if (nn === null) return;
        nn = nn.trim();
        if (!nn) return;
        var ncat = prompt('分类（工作/学习/生活/健康/项目/其他）：', tg['标签分类'] || '其他');
        var ncol = prompt('颜色（蓝/青/绿/橙/红/紫/灰）：', tg['标签颜色'] || '灰');
        updTag(id, {
          '标签名称': { text: nn },
          '标签分类': { select: ncat || tg['标签分类'] || '其他' },
          '标签颜色': { select: TAG_COLORS[ncol] ? ncol : (tg['标签颜色'] || '灰') }
        }, function () {
          var old = tg['标签名称'], hits = [];
          for (var i3 = 0; i3 < S.links.length; i3++) {
            if (S.links[i3]['标签名称'] === old) hits.push(S.links[i3]);
          }
          if (!hits.length || old === nn) { toast('标签已更新'); reload(function () { openTagManager(); }); return; }
          var p = 0;
          (function next() {
            if (p >= hits.length) {
              toast('标签已更新，同步 ' + hits.length + ' 个任务');
              reload(function () { openTagManager(); });
              return;
            }
            updLink(hits[p]['_id'], {
              '标签名称': { text: nn },
              '关联标题': { text: (hits[p]['任务标题'] || '') + ' · ' + nn }
            }, function () { p++; next(); });
          })();
        });
        return;
      }
      if (b.hasAttribute('data-tgdel')) {
        var did = b.getAttribute('data-tgdel'), dt = null;
        for (var i4 = 0; i4 < S.tags.length; i4++) { if (S.tags[i4]['_id'] === did) dt = S.tags[i4]; }
        if (!dt) return;
        var cnt = counts[dt['标签名称']] || 0;
        if (!confirm('删除标签「' + dt['标签名称'] + '」？' + (cnt ? '已关联 ' + cnt + ' 个任务，这些任务上的该标签会一并移除。' : ''))) return;
        var rels = [];
        for (var i5 = 0; i5 < S.links.length; i5++) {
          if (S.links[i5]['标签名称'] === dt['标签名称']) rels.push(S.links[i5]['_id']);
        }
        var q = 0;
        (function next2() {
          if (q >= rels.length) {
            delTag(did, function () { toast('标签已删除'); reload(function () { openTagManager(); }); });
            return;
          }
          delLink(rels[q], function () { q++; next2(); });
        })();
        return;
      }
    });
  }

  /* ---------- 11.4 某天任务清单 ---------- */
  function openDayList(ds) {
    var map = tasksByDay(), items = map[ds] || [];
    var h = '';
    if (!items.length) h = '<div class="hint">这一天没有任务。</div>';
    else {

  /* =====================================================================
     12. 待插入图片缓存（IndexedDB，防登录跳转丢失）
     ===================================================================== */
  var IDB_DB = 'sp_form_img', IDB_ST = 'f';
  var PEND = { n: 0, blobs: [] };

  function idbOpen(cb) {
    if (!window.indexedDB) { cb(null); return; }
    var req;
    try { req = indexedDB.open(IDB_DB); } catch (e) { cb(null); return; }
    req.onupgradeneeded = function () {
      var d = req.result;
      if (!d.objectStoreNames.contains(IDB_ST)) { d.createObjectStore(IDB_ST); }
    };
    req.onsuccess = function () {
      var d = req.result;
      if (!d.objectStoreNames.contains(IDB_ST)) {
        var nv = d.version + 1;
        try { d.close(); } catch (e) {}
        var r2 = indexedDB.open(IDB_DB, nv);
        r2.onupgradeneeded = function () { r2.result.createObjectStore(IDB_ST); };
        r2.onsuccess = function () { cb(r2.result); };
        r2.onerror = function () { cb(null); };
        r2.onblocked = function () { cb(null); };
        return;
      }
      cb(d);
    };
    req.onerror = function () { cb(null); };
    req.onblocked = function () { cb(null); };
  }
  function idbPut(key, blob, cb) {
    idbOpen(function (d) {
      if (!d) { if (cb) cb(); return; }
      try {
        var tx = d.transaction(IDB_ST, 'readwrite');
        tx.objectStore(IDB_ST).put(blob, key);
        tx.oncomplete = function () { try { d.close(); } catch (e) {} if (cb) cb(); };
        tx.onerror = function () { try { d.close(); } catch (e) {} if (cb) cb(); };
      } catch (e) { try { d.close(); } catch (e2) {} if (cb) cb(); }
    });
  }
  function idbGet(key, cb) {
    idbOpen(function (d) {
      if (!d) { cb(null); return; }
      try {
        var tx = d.transaction(IDB_ST, 'readonly');
        var rq = tx.objectStore(IDB_ST).get(key);
        rq.onsuccess = function () { try { d.close(); } catch (e) {} cb(rq.result || null); };
        rq.onerror = function () { try { d.close(); } catch (e) {} cb(null); };
      } catch (e) { try { d.close(); } catch (e2) {} cb(null); }
    });
  }
  function idbDel(keys, cb) {
    idbOpen(function (d) {
      if (!d) { if (cb) cb(); return; }
      try {
        var tx = d.transaction(IDB_ST, 'readwrite');
        var st = tx.objectStore(IDB_ST);
        for (var i = 0; i < keys.length; i++) { st.delete(keys[i]); }
        tx.oncomplete = function () { try { d.close(); } catch (e) {} if (cb) cb(); };
        tx.onerror = function () { try { d.close(); } catch (e) {} if (cb) cb(); };
      } catch (e) { try { d.close(); } catch (e2) {} if (cb) cb(); }
    });
  }
  function imgFlagKey() { return 'sp_img_flag_' + location.pathname; }
  function imgKey(i) { return location.pathname + '::图片#' + i; }
  function markPending(n) {
    try { localStorage.setItem(imgFlagKey(), JSON.stringify({ n: n, ts: Date.now() })); } catch (e) {}
  }
  function clearPending(cb) {
    var keys = [imgFlagKey()];
    for (var i = 0; i < PEND.n; i++) { keys.push(imgKey(i)); }
    idbDel(keys, function () {
      PEND.n = 0; PEND.blobs = [];
      try { localStorage.removeItem(imgFlagKey()); } catch (e) {}
      if (cb) cb();
    });
  }
  function restorePending() {
    if (!window.indexedDB) return;
    var raw = null;
    try { raw = localStorage.getItem(imgFlagKey()); } catch (e) { return; }
    if (!raw) return;
    var flag;
    try { flag = JSON.parse(raw); } catch (e) { return; }
    if (!flag || !flag.n || (Date.now() - (flag.ts || 0)) > 48 * 3600000) {
      PEND.n = 0;
      idbDel([imgFlagKey()], function () {});
      try { localStorage.removeItem(imgFlagKey()); } catch (e) {}
      return;
    }
    var got = [], n = flag.n;
    var step = function (i) {
      if (i >= n) {
        PEND.n = got.length; PEND.blobs = got;
        if (PEND.n) toast('有 ' + PEND.n + ' 张图片未插入，可在任务详情里一键插入', 3200);
        return;
      }
      idbGet(imgKey(i), function (b) { if (b) got.push(b); step(i + 1); });
    };
    step(0);
  }
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(',')[1] || ''); };
      fr.onerror = function () { reject(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }
  function uploadOne(file) {
    if (file.size > 10 * 1024 * 1024) return Promise.reject(new Error('图片不能超过 10MB'));
    if (!/^image\//.test(file.type || '')) return Promise.reject(new Error('只支持图片文件'));
    return fileToBase64(file).then(function (b64) {
      return db.uploadImage({ data: b64, contentType: file.type, fileName: file.name });
    }).then(function (r) {
      if (!r || !r.url) throw new Error('上传失败：未返回 url');
      return { title: file.name, imageUrl: r.url };
    });
  }

  /* ---------- 13.1 HTML → Markdown（编辑结果落库为 Markdown） ---------- */
  function htmlToMd(root) {
    var out = [];
    function isBox(n) {
      var c = n.className ? String(n.className) : '';
      return c.indexOf('box') > -1;
    }
    function hasBlockChild(el) {
      var kids = el.children || [];
      for (var i = 0; i < kids.length; i++) {
        var tg = kids[i].nodeName.toLowerCase();
        if (tg === 'p' || tg === 'div' || tg === 'ul' || tg === 'ol' || tg === 'h1' || tg === 'h2' ||
            tg === 'h3' || tg === 'h4' || tg === 'blockquote' || tg === 'pre' || tg === 'table') return true;
      }
      return false;
    }
    function inlineText(el) {
      var s = '', kids = el.childNodes;
      for (var i = 0; i < kids.length; i++) {
        var n = kids[i];
        if (n.nodeType === 3) { s += String(n.nodeValue).replace(/\u00a0/g, ' '); continue; }
        if (n.nodeType !== 1) continue;
        if (isBox(n)) continue;
        var tag = n.nodeName.toLowerCase(), inner = inlineText(n);
        if (tag === 'br') { s += '\n'; }
        else if (tag === 'strong' || tag === 'b') { s += inner ? '**' + inner + '**' : ''; }
        else if (tag === 'em' || tag === 'i') { s += inner ? '*' + inner + '*' : ''; }
        else if (tag === 'del' || tag === 's' || tag === 'strike') { s += inner ? '~~' + inner + '~~' : ''; }
        else if (tag === 'code') { s += '`' + inner + '`'; }
        else if (tag === 'a') { s += '[' + inner + '](' + (n.getAttribute('href') || '') + ')'; }
        else if (tag === 'img') {
          s += '![' + (n.getAttribute('alt') || '') + '](' + (n.getAttribute('src') || '') + ')';
        } else { s += inner; }
      }
      return s;
    }
    function eachChild(el) {
      var kids=el.childNodes,inline=document.createElement('span');
      function flushInline(){var text=inlineText(inline).trim();if(text){out.push(text);out.push('');}inline.textContent='';}
      for(var i=0;i<kids.length;i++){
        var n=kids[i];
        if(n.nodeType===3){inline.appendChild(n.cloneNode(true));continue;}
        if(n.nodeType!==1)continue;
        if(/^(P|DIV|UL|OL|H[1-6]|BLOCKQUOTE|PRE|TABLE|HR|IMG)$/.test(n.nodeName)){flushInline();blockNode(n);}
        else inline.appendChild(n.cloneNode(true));
      }
      flushInline();
    }
    function blockNode(el) {
      var tag = el.nodeName.toLowerCase();
      if (/^h[1-6]$/.test(tag)) {
        out.push(new Array(Number(tag.charAt(1)) + 1).join('#') + ' ' + inlineText(el).trim());
        out.push('');
      } else if (tag === 'p' || tag === 'div') {
        if (hasBlockChild(el)) { eachChild(el); return; }
        var txt = inlineText(el).replace(/\n+$/, '').trim();
        if (txt) { out.push(txt); out.push(''); }
      } else if (tag === 'ul' || tag === 'ol') {
        var ordered = tag === 'ol', idx = 1, lis = el.children;
        for (var i = 0; i < lis.length; i++) {
          var li = lis[i], cls = li.className ? String(li.className) : '';
          var isTask = cls.indexOf('task') > -1, done = cls.indexOf('done') > -1;
          var txt2 = inlineText(li).replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
          if (isTask) { out.push('- [' + (done ? 'x' : ' ') + '] ' + txt2); }
          else { out.push((ordered ? (idx++) + '. ' : '- ') + txt2); }
        }
        out.push('');
      } else if (tag === 'blockquote') {
        var qs = inlineText(el).replace(/\s+$/, '').split('\n');
        for (var j = 0; j < qs.length; j++) { out.push('> ' + qs[j]); }
        out.push('');
      } else if (tag === 'pre') {
        out.push('```');
        out.push(String(el.textContent || '').replace(/\n+$/, ''));
        out.push('```');
        out.push('');
      } else if (tag === 'table') {
        var trs = el.querySelectorAll('tr'), tbl = [];
        for (var r = 0; r < trs.length; r++) {
          var tds = trs[r].children, arr = [];
          for (var c = 0; c < tds.length; c++) {
            arr.push(inlineText(tds[c]).replace(/\n+/g, ' ').trim());
          }
          tbl.push(arr);
        }
        if (tbl.length) {
          out.push('| ' + tbl[0].join(' | ') + ' |');
          var sep = [];
          for (var s2 = 0; s2 < tbl[0].length; s2++) { sep.push('---'); }
          out.push('| ' + sep.join(' | ') + ' |');
          for (var r2 = 1; r2 < tbl.length; r2++) { out.push('| ' + tbl[r2].join(' | ') + ' |'); }
          out.push('');
        }
      } else if (tag === 'hr') {
        out.push('---'); out.push('');
      } else if (tag === 'img') {
        out.push('![' + (el.getAttribute('alt') || '') + '](' + (el.getAttribute('src') || '') + ')');
        out.push('');
      } else if (tag === 'br') {
        out.push('');
      } else if (hasBlockChild(el)) {
        eachChild(el);
      } else {
        var s3 = inlineText(el).trim();
        if (s3) { out.push(s3); out.push(''); }
      }
    }
    eachChild(root);
    var joined = out.join('\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n');
    return joined.replace(/^\n+/, '').replace(/\s+$/, '');
  }

      '<div class="grow"></div><button class="mini" id="tdAddLog">+ 补记</button></div>';
    if (!logs.length) p3 += '<div class="hint">暂无日志。切换任务状态时会自动生成，也可以点「+ 补记」手动补一段。</div>';
    else {
      var totalH = 0;
      for (i = 0; i < logs.length; i++) {
        var lg = logs[i], lmk = stMeta(lg['状态']);

        totalH += dur;
        p3 += '<div class="logline" data-logrow="' + esc(lg['_id']) + '">' +
          '<span class="badge" style="color:' + lmk.c + ';background:' + lmk.bg + ';border:none">' + lmk.ic + ' ' + esc(lmk.s) + '</span>' +
          '<span class="t">' + fmtDay(lg['开始时间']) + ' ' + String(lg['开始时间'] || '').slice(11, 16) + ' → ' +
            (lg['结束时间'] ? fmtDay(lg['结束时间']) + ' ' + String(lg['结束时间']).slice(11, 16) : '至今') + '</span>' +
          '<span class="d">' + fmtH(dur) + '</span>' +
          '<button class="ico-btn" data-logedit="' + esc(lg['_id']) + '" title="修改起止时间" style="width:22px;height:22px">✎</button>' +
          '<button class="ico-btn danger" data-logl="' + esc(lg['_id']) + '" title="删除这条日志" style="width:22px;height:22px">✕</button></div>';
      }
      p3 += '<div class="logline" style="border-top:1px solid var(--line);margin-top:3px;padding-top:6px">' +
        '<span class="t">累计</span><span class="d">' + fmtH(totalH) + '</span></div>';
    }
    p3 += '</div>';
    if (!compact) {
      p3 += '<div class="sect"><div class="sect-h">关联便签 · ' + nts.length +
        '<div class="grow"></div><button class="mini" id="tdAddNote">+ 记一条便签</button></div>';
      if (!nts.length) p3 += '<div class="hint">暂无关联便签。临时想到的内容可以先记成便签，再一键并入任务详情。</div>';
      else {
        for (i = 0; i < nts.length; i++) {
          p3 += '<div class="note"><div class="nx">' + esc(nts[i]['便签内容'] || '') + '</div>' +
            '<div class="nm"><span>' + esc(nts[i]['便签分类'] || '') + '</span><span>' + fmtDT(nts[i]['创建时间']) + '</span>' +
            '<span class="nact">' +
            '<button class="ico-btn" data-nmerge="' + esc(nts[i]['_id']) + '" title="并入任务详情" style="width:22px;height:22px">↧</button>' +
            '<button class="ico-btn danger" data-nunlink="' + esc(nts[i]['_id']) + '" title="解除关联" style="width:22px;height:22px">⊘</button>' +
            '</span></div></div>';
        }
      }
      p3 += '</div>';
    }
    var pane3 = '<div class="td-pane">' + p3 + '</div>';

    var panes = '<div class="td-swipe" id="tdSwipe"><div class="td-panes" id="tdPanes">' +
      pane1 + pane2 + pane3 + '</div></div>';

    var foot = '<div class="grow"></div><span class="hint" id="tdDirty">改动会自动保存</span>' +
      (compact ? '' : '<button class="btn-ghost" data-close="1">关闭</button>');

    return { head: head, tabs: tabs, panes: panes, foot: foot };
  }
  /* ---------- 13.3 详情事件绑定 ---------- */
  function bindDetail(scope, id, ctx) {
    var t = byId(id);
    if (!t) return;
    ctx = ctx || {};
    var reopen = ctx.reopen || function () { openTaskDetail(id); };
    var saved = ctx.saved || function () { closeModal(); reload(); };
    var deleted = ctx.deleted || function () { closeModal(); reload(); };
    var compact = !!ctx.compact;
    var editor = scope.querySelector('#mdEdit');
    var staged = { st: t['任务状态'] || ST_DEFAULT, pr: t['优先级'] || '', ico: t['任务图标'] || '' };

    function markDirty() {
      var el = scope.querySelector('#tdDirty');
      if (el) el.textContent = '有未保存的改动';
      if (typeof draftNow==='function')draftNow();
      if (mdTimer)clearTimeout(mdTimer);
      mdTimer=setTimeout(function(){autosave(null);},900);
    }
    function syncStat() {
      var el = scope.querySelector('#mdStat');
      if (el && editor) { el.textContent = (editor.textContent || '').length + ' 字'; }
    }
    function syncToolState() {
      if (!editor || typeof document.queryCommandState !== 'function') return;
      var btns = scope.querySelectorAll('[data-wcmd]'), map = { bold: 'bold', italic: 'italic', strike: 'strike' };
      for (var i = 0; i < btns.length; i++) {
        var c = btns[i].getAttribute('data-wcmd'), on = false;
        if (map[c]) { try { on = !!document.queryCommandState(map[c]); } catch (e) { on = false; } }
        btns[i].className = on ? 'on' : '';
      }
    }
    function insertImageInto(it) {
      if (!editor) return;
      editor.focus();
      var html = '<img src="' + esc(it.imageUrl) + '" alt="' + esc(it.title || '') + '"><p><br></p>';
      var done = false;
      try { done = document.execCommand('insertHTML', false, html); } catch (e) { done = false; }
      if (!done) { editor.innerHTML = (editor.innerHTML || '') + html; }
      markDirty(); syncStat();
    }
    function execCmd(cmd) {
      if (!editor) return;
      if (cmd === 'image') { pickImages(insertImageInto); return; }
      editor.focus();
      try {
        if (cmd === 'bold') { document.execCommand('bold'); }
        else if (cmd === 'italic') { document.execCommand('italic'); }
        else if (cmd === 'strike') { document.execCommand('strikeThrough'); }
        else if (cmd === 'h1') { document.execCommand('formatBlock', false, 'H1'); }
        else if (cmd === 'h2') { document.execCommand('formatBlock', false, 'H2'); }
        else if (cmd === 'h3') { document.execCommand('formatBlock', false, 'H3'); }
        else if (cmd === 'p') { document.execCommand('formatBlock', false, 'P'); }
        else if (cmd === 'ul') { document.execCommand('insertUnorderedList'); }
        else if (cmd === 'ol') { document.execCommand('insertOrderedList'); }
        else if (cmd === 'quote') { document.execCommand('formatBlock', false, 'BLOCKQUOTE'); }
        else if (cmd === 'pre') { document.execCommand('formatBlock', false, 'PRE'); }
        else if (cmd === 'hr') { document.execCommand('insertHorizontalRule'); }
        else if (cmd === 'code') { document.execCommand('insertHTML', false, '<code>代码</code>&nbsp;'); }
        else if (cmd === 'clear') { document.execCommand('removeFormat'); }
        else if (cmd === 'task') {
          document.execCommand('insertHTML', false,
            '<ul><li class="task"><span class="box">✓</span><span>待办项</span></li></ul><p><br></p>');
        } else if (cmd === 'table') {
          document.execCommand('insertHTML', false,
            '<table><thead><tr><th>列1</th><th>列2</th></tr></thead><tbody>' +
            '<tr><td>内容</td><td>内容</td></tr></tbody></table><p><br></p>');
        } else if (cmd === 'link') {
          var u = prompt('链接地址：', 'https://');
          if (u && OneDayCore.safeURL(u,false)) { document.execCommand('createLink', false, u); } else if (u) { toast('只支持安全的 http(s) 或邮件链接'); }
        }
      } catch (e) { /* 无 execCommand 的环境静默降级 */ }
      markDirty(); syncStat(); syncToolState();
    }

    if (editor) {
      editor.innerHTML = mdToHtml(t['任务详情'] || '');
      var initialMarkdown=htmlToMd(editor),initialRawMarkdown=t['任务详情']||'';
      syncStat();
      editor.addEventListener('input', function () { markDirty(); syncStat(); });
      editor.addEventListener('keyup', syncToolState);
      editor.addEventListener('mouseup', syncToolState);
      editor.addEventListener('paste', function (e) {
        try {
          e.preventDefault();
          var txt = (e.clipboardData || window.clipboardData).getData('text/plain');
          document.execCommand('insertText', false, txt);
          markDirty(); syncStat();
        } catch (err) {}
      });
    }
    renderDetailTags();
    renderMdPend();

    /* ---- 三页签（任务内容 / 任务属性 / 任务日志）+ 左右滑动切换 ---- */
    var swipeIdx = 0;
    function setTab(i, animate) {
      swipeIdx = Math.max(0, Math.min(2, i));
      var panes = scope.querySelector('#tdPanes');
      if (panes) {
        panes.style.transition = (animate === false) ? 'none' : '';
        panes.style.transform = 'translateX(' + (-swipeIdx * 100) + '%)';
      }
      var bs = scope.querySelectorAll('#tdTabs button');
      for (var k = 0; k < bs.length; k++) {
        bs[k].className = (Number(bs[k].getAttribute('data-tdtab')) === swipeIdx) ? 'on' : '';
      }
    }
    setTab(0, false);
    var swipeEl = scope.querySelector('#tdSwipe');
    if (swipeEl) {
      var sx = 0, dx = 0, swiping = false;
      var paneBox = scope.querySelector('#tdPanes');
      function swMove(e) {
        if (!swiping) return;
        var t0 = e.touches && e.touches[0];
        dx = (e.touches ? t0.clientX : e.clientX) - sx;
        if (Math.abs(dx) < 6) return;
        if (paneBox) paneBox.style.transform = 'translateX(calc(' + (-swipeIdx * 100) + '% + ' + dx + 'px))';
        if (e.cancelable) e.preventDefault();
      }
      function swEnd() {
        if (!swiping) return;
        swiping = false;
        if (Math.abs(dx) > 56) { setTab(swipeIdx + (dx < 0 ? 1 : -1)); } else { setTab(swipeIdx); }
        dx = 0;
        document.removeEventListener('mousemove', swMove);
        document.removeEventListener('mouseup', swEnd);
        document.removeEventListener('touchmove', swMove);
        document.removeEventListener('touchend', swEnd);
      }
      swipeEl.addEventListener('mousedown', function (e) {
        if (e.target.closest && e.target.closest("input,textarea,select,button,[contenteditable='true']")) return;
        swiping = true; sx = e.clientX; dx = 0;
        if (paneBox) paneBox.style.transition = 'none';
        document.addEventListener('mousemove', swMove);
        document.addEventListener('mouseup', swEnd);
      });
      swipeEl.addEventListener('touchstart', function (e) {
        if (e.target.closest && e.target.closest("input,textarea,select,button,[contenteditable='true']")) return;
        swiping = true; sx = e.touches[0].clientX; dx = 0;
        if (paneBox) paneBox.style.transition = 'none';
        document.addEventListener('touchmove', swMove, { passive: false });
        document.addEventListener('touchend', swEnd);
      }, { passive: true });
    }

    function renderDetailTags() {
      var area = scope.querySelector('#tdTagArea');
      if (!area) return;
      var ls = taskTags(id), h = '', i;
      for (i = 0; i < ls.length; i++) { h += tagChip(ls[i]); }
      var avail = [];
      for (i = 0; i < S.tags.length; i++) {
        if (!hasTag(id, S.tags[i]['标签名称'])) avail.push(S.tags[i]['标签名称']);
      }
      if (avail.length) {
        h += '<select class="tag-add" id="tdAddTag"><option value="">+ 标签</option>';
        for (i = 0; i < avail.length; i++) {
          h += '<option value="' + esc(avail[i]) + '">' + esc(avail[i]) + '</option>';
        }
        h += '</select>';
      } else { h += '<button class="tag-add" data-tagmgr="1">管理标签库</button>'; }
      area.innerHTML = h;
    }
    function renderMdPend() {
      var box = scope.querySelector('#mdPend');
      if (!box) return;
      if (!PEND.n) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="notice" style="display:flex;align-items:center;gap:9px">' +
        '有 ' + PEND.n + ' 张图片待插入' +
        '<span class="grow" style="flex:1"></span>' +
        '<button class="btn-ghost" style="padding:4px 10px;font-size:11.5px" id="mdPendDrop">丢弃</button>' +
        '<button class="btn-primary" style="padding:4px 10px;font-size:11.5px" id="mdPendGo">插入</button></div>';
    }

    scope.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-close')) { closeModal(); return; }
      if (b.hasAttribute('data-tdtab')) { setTab(Number(b.getAttribute('data-tdtab'))); return; }
      if (b.hasAttribute('data-wcmd')) { execCmd(b.getAttribute('data-wcmd')); return; }
      if (b.hasAttribute('data-dst')) {
        var newSt = b.getAttribute('data-dst');
        staged.st = newSt;
        var ss = scope.querySelectorAll('#tdSt button');
        for (var i2 = 0; i2 < ss.length; i2++) {
          var mm = stMeta(ss[i2].getAttribute('data-dst')), on = ss[i2].getAttribute('data-dst') === staged.st;
          ss[i2].style.background = on ? mm.bg : 'transparent';
          ss[i2].style.borderColor = on ? mm.c : 'var(--line)';
        }
        applyStatus(newSt); return;
      }
      if (b.hasAttribute('data-dpr')) {
        staged.pr = b.hasAttribute('data-dpr') ? b.getAttribute('data-dpr') : '';
        var cs = scope.querySelectorAll('#tdPr .chip-opt');
        for (var i3 = 0; i3 < cs.length; i3++) {
          cs[i3].className = 'chip-opt' + (cs[i3].getAttribute('data-dpr') === staged.pr ? ' on' : '');
        }
        autosave(null); return;
      }
      if (b.id === 'tdIcon') {
        openIconPicker(null, function (v) {
          staged.ico = v;
          markDirty();
          var el = scope.querySelector('#tdIcon');
          if (el) el.textContent = v || '＋';
          markDirty();
        });
        setTimeout(function () { var f = $('icoFree'); if (f) f.value = staged.ico; }, 20);
        return;
      }
      if (b.hasAttribute('data-deltag')) {
        delLink(b.getAttribute('data-deltag'), function () { toast('已移除标签'); reload(reopen); });
        return;
      }
      if (b.hasAttribute('data-dellog') || b.hasAttribute('data-logl')) {
        var lid = b.getAttribute('data-logl') || b.getAttribute('data-dellog');
        if (!confirm('删除这条状态日志？仅删日志，不影响任务当前状态。')) return;
        delLog(lid, function () { toast('日志已删除'); reload(reopen); });
        return;
      }
      if (b.hasAttribute('data-logedit')) { startLogEdit(b.getAttribute('data-logedit')); return; }
      if (b.hasAttribute('data-logsave')) { saveLogEdit(b.getAttribute('data-logsave')); return; }
      if (b.hasAttribute('data-logcancel')) { reload(reopen); return; }
      if (b.id === 'tdAddLog') { openLogAdd(id, reopen); return; }
      if (b.id === 'tdAddSub') { closeModal(); openTaskForm(null, id); return; }
      if (b.id === 'tdAddNote') { closeModal(); openNotes(true, id); return; }
      if (b.hasAttribute('data-nmerge')) {
        var nn2 = null;
        for (var i4 = 0; i4 < S.notes.length; i4++) { if (S.notes[i4]['_id'] === b.getAttribute('data-nmerge')) nn2 = S.notes[i4]; }
        if (!nn2) return;
        mergeNoteIntoTask(nn2, id, function () { toast('已并入任务详情'); reload(reopen); });
        return;
      }
      if (b.hasAttribute('data-nunlink')) {
        updNote(b.getAttribute('data-nunlink'), {
          '关联任务ID': { text: '' }, '关联任务标题': { text: '' },
          '便签状态': { select: '未处理' }, '更新时间': { date: nowISO() }
        }, function () { toast('已解除关联'); reload(reopen); });
        return;
      }
      if (b.id === 'mdPendGo') {
        var queue = PEND.blobs.slice();
        clearPending(function () {
          var chain = Promise.resolve();
          queue.forEach(function (blob) {
            chain = chain.then(function () {
              var f = new File([blob], 'image.png', { type: blob.type || 'image/png' });
              return uploadOne(f).then(function (it) { insertImageInto(it); });
            });
          });
          chain.then(function () { toast('已插入 ' + queue.length + ' 张图片'); renderMdPend(); })
               .catch(function () { toast('部分图片插入失败'); renderMdPend(); });
        });
        return;
      }
      if (b.id === 'mdPendDrop') { clearPending(function () { renderMdPend(); toast('已丢弃待插入图片'); }); return; }
    });

    scope.addEventListener('change', function (e) {
      if (e.target.id === 'tdAddTag' && e.target.value) {
        var tag = e.target.value;
        addLink({
          '关联标题': { text: (t['任务标题'] || '') + ' · ' + tag },
          '任务ID': { text: id }, '任务标题': { text: t['任务标题'] || '' },
          '标签名称': { text: tag }, '创建时间': { date: nowISO() }
        }, function () { toast('已添加标签「' + tag + '」'); reload(reopen); });
      }
    });

    function startLogEdit(lid) {
      var lg = null, i;
      for (i = 0; i < S.logs.length; i++) { if (S.logs[i]['_id'] === lid) lg = S.logs[i]; }
      if (!lg) return;
      var row = scope.querySelector('[data-logrow="' + lid + '"]');
      if (!row) return;
      var opts = '';
      for (i = 0; i < STATUSES.length; i++) {
        opts += '<option value="' + esc(STATUSES[i].n) + '"' +
          (STATUSES[i].n === lg['状态'] ? ' selected' : '') + '>' + esc(STATUSES[i].n) + '</option>';
      }
      row.className = 'logline editing';
      row.innerHTML = '<select id="lgState" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;' +
        'background:var(--panel-solid);font-size:11.5px">' + opts + '</select>' +
        '<input type="datetime-local" id="lgStart" value="' + toLocalInput(lg['开始时间']) + '">' +
        '<span class="t">→</span>' +
        '<input type="datetime-local" id="lgEnd" value="' + toLocalInput(lg['结束时间']) + '">' +
        '<button class="btn-primary" style="padding:3px 10px;font-size:11.5px" data-logsave="' + esc(lid) + '">保存</button>' +
        '<button class="btn-ghost" style="padding:3px 10px;font-size:11.5px" data-logcancel="1">取消</button>';
    }
    function saveLogEdit(lid) {
      var s = scope.querySelector('#lgStart'), e2 = scope.querySelector('#lgEnd'), st2 = scope.querySelector('#lgState');
      if (!s || !e2) return;
      var sv = fromLocalInput(s.value), ev = fromLocalInput(e2.value);
      if (sv && ev && ev < sv) { toast('结束时间不能早于开始时间'); return; }
      var props = {
        '开始时间': { date: sv },
        '结束时间': { date: ev },
        '持续时长': { number: (sv && ev) ? Math.round(hoursBetween(sv, ev) * 100) / 100 : null }
      };
      if (st2 && st2.value) { props['状态'] = { select: st2.value }; }
      updLog(lid, props, function () { toast('日志已更新'); reload(reopen); });
    }

    /** 汇总「标题 + 属性栏 + 正文」的当前值 */
    function collectProps() {
      var title = (scope.querySelector('#tdTitle').value || '').trim();
      var parentEl = scope.querySelector('#tdParent');
      var parentV = parentEl ? parentEl.value : '';
      var mdText = editor ? htmlToMd(editor) : (t['任务详情'] || '');
      if(editor && mdText===initialMarkdown)mdText=initialRawMarkdown;
      return {
        '任务标题': { text: title },
        '任务图标': { text: staged.ico || '' },
        '任务详情': { text: mdText },
        '任务类型': { select: parentV ? '子任务' : '主任务' },
        '父任务ID': { text: parentV || '' },
        '优先级': { select: staged.pr || null },
        '计划开始时间': { date: OneDayCore.planDate(scope.querySelector('#tdPs').value,t['计划开始时间'],false) },
        '计划截止时间': { date: OneDayCore.planDate(scope.querySelector('#tdPd').value,t['计划截止时间'],true) }
      };
    }
    var saveSeq=0,saving=false,dirtyAgain=false,mdTimer=null;
    function draftNow(){
      var props=collectProps();
      if(Object.keys(OneDayCore.diffProps(props,t)).length)odStore('draft.'+id,{props:props,base:t,time:Date.now()});
    }
    function autosave(extra){
      if(mdTimer){clearTimeout(mdTimer);mdTimer=null;}
      var d=scope.querySelector('#tdDirty'),props=collectProps();
      if(extra)Object.keys(extra).forEach(function(k){props[k]=extra[k];});
      var patch=OneDayCore.diffProps(props,t);
      if(!Object.keys(patch).length)return;
      draftNow();
      if(!props['任务标题'].text){if(d)d.textContent='标题不能为空，草稿未提交';return;}
      var pstart=props['计划开始时间'].date,pend=props['计划截止时间'].date;
      if(pstart&&pend&&pend<pstart){if(d)d.textContent='截止不能早于开始，草稿未提交';return;}
      if(saving){dirtyAgain=true;return;}
      saving=true;if(d)d.textContent='保存中…';
      odGuardedPatch(id,patch,t,function(err){
        saving=false;
        if(err){if(d)d.textContent='未保存：'+describeErr(err);return;}
        Object.keys(patch).forEach(function(k){t[k]=OneDayCore.value(patch[k]);});
        if(d)d.textContent='已保存 · '+new Date().toTimeString().slice(0,5);
        if(!Object.keys(OneDayCore.diffProps(collectProps(),t)).length)odRemove('draft.'+id);
        if(PEND.n)clearPending(function(){});
        reload();
        if(dirtyAgain){dirtyAgain=false;autosave(null);}
      });
    }
    scope.__odFlush=function(){autosave(null);};
    scope.addEventListener('input',function(){draftNow();if(mdTimer)clearTimeout(mdTimer);mdTimer=setTimeout(function(){autosave(null);},900);});
    var draft=odRead('draft.'+id,null);
    if(draft&&draft.props&&Object.keys(OneDayCore.diffProps(draft.props,t)).length){
      var notice=document.createElement('div');notice.className='od-draft-notice';
      notice.innerHTML='发现本机未提交草稿。<button type="button" data-od-draft="restore">恢复草稿</button><button type="button" data-od-draft="drop">丢弃草稿</button>';
      scope.querySelector('.td-head').insertAdjacentElement('afterend',notice);
      notice.addEventListener('click',function(e){var a=e.target.getAttribute('data-od-draft');if(!a)return;
        if(a==='restore'){
          var p=draft.props;
          scope.querySelector('#tdTitle').value=OneDayCore.value(p['任务标题'])||'';
          if(editor)editor.innerHTML=mdToHtml(OneDayCore.value(p['任务详情'])||'');
          staged.ico=OneDayCore.value(p['任务图标'])||'';staged.pr=OneDayCore.value(p['优先级'])||'';
          scope.querySelector('#tdPs').value=String(OneDayCore.value(p['计划开始时间'])||'').slice(0,16);
          scope.querySelector('#tdPd').value=String(OneDayCore.value(p['计划截止时间'])||'').slice(0,16);

  function buildNotesSections(list, compact) {

      else rest.push(list[i]);

    var h = '';
    h += section('置顶 · ' + pins.length, pins);

    return h;

      if (!arr.length) return '';

        applyBg(mergeBg({ type: 'solid', value: '#f4f5f8', theme: 'auto', scrim: 0, panel: 0.62, blur: 0 }));

    mask.addEventListener('input', function (e) {

      if (e.target.id === 'setPanel') { applyBg(mergeBg({ panel: Number(e.target.value) / 100 }), true); }

  function openReport() {
    var b = new Date(); b.setDate(b.getDate() - 6);
    var defFrom = dstr(b), defTo = dstr(today());
    if (S.period === 'custom' && S.from && S.to) { defFrom = S.from; defTo = S.to; }

      '<div class="fld"><label>开始日期</label><input type="date" id="rFrom" value="' + defFrom + '"></div>' +
      '<div class="fld"><label>结束日期</label><input type="date" id="rTo" value="' + defTo + '"></div>' +

      '</div><div id="rOut"></div>';
    var mask = modal({ title: '周报 / 阶段汇总', cls: 'w980', body: h,
      foot: '<button class="btn-ghost" data-close="1">关闭</button>' });
    mask.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      if (btn.hasAttribute('data-close')) { closeModal(); return; }
      if (btn.id === 'rGo') {
        var a = $('rFrom').value, z = $('rTo').value;
        if (!a || !z) { toast('请选择日期范围'); return; }
        if (a > z) { toast('开始不能晚于结束'); return; }
        reload(function () { renderReport(a, z); });
      }
      if (btn.id === 'rCopy') {
        var ta = $('rMd');
        if (ta) { ta.select(); try { document.execCommand('copy'); toast('已复制'); } catch (err) { toast('请手动复制'); } }
      }
    });
    renderReport(defFrom, defTo);
  }
  function renderReport(a, z) {
    var lo = new Date(a + 'T00:00:00').getTime(), hi = new Date(z + 'T23:59:59').getTime();
    var inR = function (s) { var d = parseDT(s); return !!d && d.getTime() >= lo && d.getTime() <= hi; };
    var created = [], doneLS = [], endLS = [], touched = {}, tagCnt = {}, prCnt = {}, stHours = {}, stCount = {};
    for (var i = 0; i < STATUSES.length; i++) { stHours[STATUSES[i].n] = 0; stCount[STATUSES[i].n] = 0; }
    for (var j = 0; j < S.tasks.length; j++) {
      var t = S.tasks[j];
      if (inR(t['创建时间'])) created.push(t);
      if (overlapRange(t, lo, hi)) touched[t['_id']] = t;
    }
    for (var k = 0; k < S.logs.length; k++) {
      var lg = S.logs[k];
      var s1 = parseDT(lg['开始时间']), e1 = lg['结束时间'] ? parseDT(lg['结束时间']) : new Date();
      if (!s1 || !e1) continue;
      var os = Math.max(s1.getTime(), lo), oe = Math.min(e1.getTime(), hi);
      var hrs = oe > os ? (oe - os) / 3600000 : 0;
      if (hrs > 0) {
        stHours[lg['状态']] = (stHours[lg['状态']] || 0) + hrs;
        stCount[lg['状态']] = (stCount[lg['状态']] || 0) + 1;
      }
      if (lg['状态'] === '完成' && inR(lg['开始时间'])) doneLS.push(lg);
      if (lg['状态'] === '结束（未完成）' && inR(lg['开始时间'])) endLS.push(lg);
    }
    for (var m = 0; m < S.links.length; m++) {
      var lk = S.links[m];
      if (!touched[lk['任务ID']]) continue;
      tagCnt[lk['标签名称']] = (tagCnt[lk['标签名称']] || 0) + 1;
    }
    var tl = [];
    for (var key in touched) { if (touched.hasOwnProperty(key)) tl.push(touched[key]); }
    tl.sort(function (x, y) {
      return String(anchorOf(x)).localeCompare(String(anchorOf(y)));
    });
    for (var q = 0; q < tl.length; q++) {
      var pn = tl[q]['优先级'] || '未设置';
      prCnt[pn] = (prCnt[pn] || 0) + 1;
    }
    var totalH = 0;
    for (var sn in stHours) { if (stHours.hasOwnProperty(sn)) totalH += stHours[sn]; }
    var noteCnt = 0;
    for (var n = 0; n < S.notes.length; n++) { if (inR(S.notes[n]['创建时间'])) noteCnt++; }

    var o = '<div class="sect" style="border-top:none;margin-top:0;padding-top:0"><div class="sect-h">周期概览</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px">';
    o += rcell('新增任务', created.length + ' 个');
    o += rcell('涉及任务', tl.length + ' 个');
    o += rcell('完成', doneLS.length + ' 个');
    o += rcell('结束（未完成）', endLS.length + ' 个');
    o += rcell('新建便签', noteCnt + ' 条');
    o += rcell('累计状态时长', fmtH(totalH));
    o += '</div></div>';

    o += '<div class="sect"><div class="sect-h">状态耗时分布</div>';
    if (totalH <= 0) o += '<div class="hint">该周期内没有状态时间记录。</div>';
    else {
      o += '<table class="tbl"><thead><tr><th>状态</th><th class="num">耗时</th><th class="num">占比</th>' +
           '<th class="num">日志条数</th></tr></thead><tbody>';
      for (var s2 = 0; s2 < STATUSES.length; s2++) {
        var meta = STATUSES[s2], hv = stHours[meta.n] || 0;
        if (hv <= 0) continue;
        o += '<tr><td>' + statusBadge(meta.n) + '</td><td class="num">' + fmtH(hv) + '</td>' +
          '<td class="num">' + (Math.round(hv / totalH * 1000) / 10) + '%</td>' +
          '<td class="num">' + (stCount[meta.n] || 0) + '</td></tr>';
      }
      o += '</tbody></table>';
    }
    o += '</div>';

    o += '<div class="sect"><div class="sect-h">优先级分布</div><div class="chips">';
    var anyP = false;
    for (var r2 = 0; r2 < PRIOS.length; r2++) {
      if (!prCnt[PRIOS[r2].n]) continue;
      anyP = true;
      o += '<span class="tag" style="color:' + PRIOS[r2].c + ';background:' + PRIOS[r2].bg + ';padding:3px 10px">' +
        PRIOS[r2].ic + ' ' + PRIOS[r2].n + ' · ' + prCnt[PRIOS[r2].n] + '</span>';
    }
    if (prCnt['未设置']) { anyP = true; o += '<span class="tag" style="background:var(--seg-bg);padding:3px 10px">未设置 · ' + prCnt['未设置'] + '</span>'; }
    if (!anyP) o += '<span class="hint">无</span>';
    o += '</div></div>';

    o += '<div class="sect"><div class="sect-h">任务明细</div>';
    if (!tl.length) o += '<div class="hint">该周期内没有任务。</div>';
    else {
      o += '<table class="tbl"><thead><tr><th>任务</th><th>状态</th><th>优先级</th><th>标签</th>' +
           '<th>计划区间</th><th class="num">进度</th></tr></thead><tbody>';
      for (var w = 0; w < tl.length; w++) {
        var tt = tl[w], tgs = tagsOf(tt['_id']), chips = '';
        for (var x = 0; x < tgs.length; x++) {
          var pr2 = tagColor(tgs[x]);
          chips += '<span class="tag" style="color:' + pr2[0] + ';background:' + pr2[1] + '">' + esc(tgs[x]) + '</span> ';
        }
        o += '<tr><td><span style="cursor:pointer" data-open="' + esc(tt['_id']) + '">' +
          (tt['任务类型'] === '子任务' ? '　└ ' : '') + (iconOf(tt) ? iconOf(tt) + ' ' : '') + esc(tt['任务标题']) + '</span></td>' +
          '<td>' + statusBadge(tt['任务状态'] || ST_DEFAULT) + '</td>' +
          '<td>' + (prioBadge(tt['优先级']) || '—') + '</td>' +
          '<td>' + (chips || '—') + '</td>' +
          '<td>' + (dayOf(tt['计划开始时间']) || '—') + ' → ' + (dayOf(tt['计划截止时间']) || '—') + '</td>' +
          '<td class="num">' + Number(tt['任务进度'] || 0) + '%</td></tr>';
      }
      o += '</tbody></table>';
    }
    o += '</div>';

    o += '<div class="sect"><div class="sect-h">标签分布</div><div class="chips">';
    var tgs2 = [];
    for (var tn in tagCnt) { if (tagCnt.hasOwnProperty(tn)) tgs2.push([tn, tagCnt[tn]]); }
    tgs2.sort(function (x2, y2) { return y2[1] - x2[1]; });
    if (!tgs2.length) o += '<span class="hint">无</span>';
    for (var v = 0; v < tgs2.length; v++) {
      var pair2 = tagColor(tgs2[v][0]);
      o += '<span class="tag" style="color:' + pair2[0] + ';background:' + pair2[1] + ';padding:3px 10px">' +
        esc(tgs2[v][0]) + ' · ' + tgs2[v][1] + '</span>';
    }
    o += '</div></div>';

    o += '<div class="sect"><div class="sect-h">周报文本（Markdown）</div>' +
      '<textarea class="md-edit" id="rMd" readonly style="border:1px solid var(--line);border-radius:10px;' +
      'min-height:220px;background:var(--panel-2)">' +
      esc(reportMarkdown(a, z, { created: created, touched: tl, doneLS: doneLS, endLS: endLS,
        stHours: stHours, tagCnt: tgs2, prCnt: prCnt, totalH: totalH, noteCnt: noteCnt })) +
      '</textarea><div style="margin-top:9px"><button class="btn-ghost" id="rCopy">复制 Markdown</button></div></div>';

    $('rOut').innerHTML = o;
  }
  function rcell(k, v) {
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel-2)">' +
      '<div class="hint">' + esc(k) + '</div><div style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums">' +
      esc(v) + '</div></div>';
  }
  function overlapRange(t, lo, hi) {
    var ps = parseDT(t['计划开始时间']), pe = parseDT(t['计划截止时间']);
    if (!ps && !pe) { var c = parseDT(t['创建时间']); return c ? (c.getTime() >= lo && c.getTime() <= hi) : false; }
    var s = (ps || pe).getTime(), e = (pe || ps).getTime();
    return s <= hi && e >= lo;
  }
  function reportMarkdown(a, z, d) {
    var L = [];
    L.push('# 工作周报（' + a + ' ~ ' + z + '）');
    L.push('');
    L.push('## 一、周期概览');
    L.push('');
    L.push('| 指标 | 数值 |');
    L.push('| --- | --- |');
    L.push('| 新增任务 | ' + d.created.length + ' 个 |');
    L.push('| 涉及任务 | ' + d.touched.length + ' 个 |');
    L.push('| 完成任务 | ' + d.doneLS.length + ' 个 |');
    L.push('| 结束（未完成） | ' + d.endLS.length + ' 个 |');
    L.push('| 新建便签 | ' + d.noteCnt + ' 条 |');
    L.push('| 累计状态时长 | ' + fmtH(d.totalH) + ' |');
    L.push('');
    L.push('## 二、状态耗时');
    L.push('');
    L.push('| 状态 | 耗时 | 占比 |');
    L.push('| --- | --- | --- |');
    for (var i = 0; i < STATUSES.length; i++) {
      var hv = d.stHours[STATUSES[i].n] || 0;
      if (hv <= 0) continue;
      L.push('| ' + STATUSES[i].n + ' | ' + fmtH(hv) + ' | ' + (Math.round(hv / d.totalH * 1000) / 10) + '% |');
    }
    L.push('');
    L.push('## 三、优先级分布');
    L.push('');
    for (var p = 0; p < PRIOS.length; p++) {
      if (d.prCnt[PRIOS[p].n]) L.push('- ' + PRIOS[p].n + '：' + d.prCnt[PRIOS[p].n] + ' 个');
    }
    if (d.prCnt['未设置']) L.push('- 未设置：' + d.prCnt['未设置'] + ' 个');
    L.push('');
    L.push('## 四、本周完成');
    L.push('');
    if (!d.doneLS.length) L.push('- 无');
    else { for (var j = 0; j < d.doneLS.length; j++) { L.push('- ' + d.doneLS[j]['任务标题'] + '（' + fmtDT(d.doneLS[j]['开始时间']) + '）'); } }
    L.push('');
    L.push('## 五、进行中 / 待推进');
    L.push('');
    var open = [];
    for (var k = 0; k < d.touched.length; k++) {
      var tt = d.touched[k];
      if ((tt['任务状态'] || ST_DEFAULT) === '完成') continue;
      open.push(tt);
    }
    if (!open.length) L.push('- 无');
    else {
      for (var m = 0; m < open.length; m++) {
        var o = open[m];
        L.push('- [' + (o['任务状态'] || ST_DEFAULT) + '] ' + o['任务标题'] + '（' + Number(o['任务进度'] || 0) + '%' +
          (dayOf(o['计划截止时间']) ? '，截止 ' + dayOf(o['计划截止时间']) : '') + '）');
      }
    }
    L.push('');
    L.push('## 六、标签分布');
    L.push('');
    if (!d.tagCnt.length) L.push('- 无');
    else { for (var n = 0; n < d.tagCnt.length; n++) { L.push('- ' + d.tagCnt[n][0] + '：' + d.tagCnt[n][1] + ' 个任务'); } }
    L.push('');
    L.push('## 七、下阶段计划');
    L.push('');
    L.push('- （在此补充）');
    return L.join('\n');
  }

  var undoTimer = null;
  function showUndo(title, ids) {
    clearUndo();
    var el = document.createElement('div');
    el.className = 'undo-bar';
    el.innerHTML = '<span class="txt">已把「' + esc(title) + '」移入回收站</span>' +
      '<button id="undoGo">撤销</button><span class="bar2 run"></span>';
    document.body.appendChild(el);
    S.undo = { ids: ids, el: el };
    el.querySelector('#undoGo').addEventListener('click', function () {
      var arr = (S.undo && S.undo.ids) ? S.undo.ids.slice() : [];
      clearUndo();
      var i = 0;
      (function step() {
        if (i >= arr.length) { toast('已恢复'); reload(); return; }
        restoreTask(arr[i], function () { i++; step(); });
      })();
    });
    undoTimer = setTimeout(function () { clearUndo(); }, 10000);
  }
  function clearUndo() {
    if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
    if (S.undo && S.undo.el && S.undo.el.parentNode) { S.undo.el.parentNode.removeChild(S.undo.el); }
    S.undo = null;
  }

      h += '<div class="hint" style="text-align:center;padding:26px 0">回收站是空的。</div>';
    } else {
      for (var i = 0; i < list.length; i++) {
        var t = list[i], m = stMeta(t['任务状态'] || ST_DEFAULT);
        h += '<div class="rb-item"><span style="font-size:14px">' + (iconOf(t) || m.ic) + '</span>' +
          '<span class="t">' + esc(t['任务标题'] || '(未命名)') +
          (t['任务类型'] === '子任务' ? '<span class="hint"> · 子任务</span>' : '') + '</span>' +
          '<span class="rb-days">' + esc(fmtDT(t['删除时间'])) + ' · 手动保留</span>' +
          '<button class="btn-ghost" style="padding:4px 10px;font-size:11.5px" data-rcrestore="' +
            esc(t['_id']) + '">恢复</button>' +
          '<button class="ico-btn danger" data-rcpurge="' + esc(t['_id']) + '" title="彻底删除">✕</button></div>';
      }
    }
    var lm = modal({
      title: '回收站 · ' + list.length + ' 项', cls: 'w760', body: h,
      foot: '<button class="btn-ghost" data-close="1">关闭</button><div class="grow"></div>' +
        (list.length ? '<button class="btn-ghost" id="rcEmpty" style="color:#c0392b;border-color:rgba(192,57,43,.3)">清空回收站</button>' : '')
    });
    lm.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-close')) { closeModal(); return; }
      if (b.hasAttribute('data-rcrestore')) {
        restoreTask(b.getAttribute('data-rcrestore'), function () {
          toast('已恢复到任务列表'); closeModal(); reload();
        });
        return;
      }
      if (b.hasAttribute('data-rcpurge')) {
        if (!confirm('彻底删除这个任务？不可恢复，标签关联会一并解除。')) return;
        purgeTask(b.getAttribute('data-rcpurge'), function () {
          toast('已彻底删除'); closeModal(); reload();
        });
        return;
      }
      if (b.id === 'rcEmpty') {
        if (!confirm('清空回收站？所有已删除的任务会被彻底删除，不可恢复。')) return;
        var arr = recycledTasks(), k = 0;
        (function step() {
          if (k >= arr.length) { toast('回收站已清空'); closeModal(); reload(); return; }
          purgeTask(arr[k]['_id'], function () { k++; step(); });
        })();
      }
    });
  }

  /* =====================================================================
     18. 事件与快捷键
     ===================================================================== */
  function ctxParent() {
    var sel = S.selId ? byId(S.selId) : null;
    if (!sel) return null;
    if (sel['任务类型'] === '子任务' && sel['父任务ID']) return sel['父任务ID'];
    return sel['_id'];
  }
  function inMaskOrDrawer(el) {
    return !!(el.closest && (el.closest('.mask') || el.closest('.drawer')));
  }

  document.addEventListener('click', function (e) {
    var el = e.target;
    var hit = function (sel) { return el.closest ? el.closest(sel) : null; };

    var tabBtn = hit('[data-tab]');
    if (tabBtn) {
      S.tab = tabBtn.getAttribute('data-tab');
      if (S.tab === 'note') { renderAll(); return; }
      renderAll(); return;
    }
    var viewBtn = hit('[data-view]');
    if (viewBtn) {
      S.view = viewBtn.getAttribute('data-view');
      if (S.view === 'month' || S.view === 'week') { S.calDim = S.view; }
      renderAll(); return;
    }

    var bg2 = hit('[data-bgroup]');
    if (bg2) { S.boardGroup = bg2.getAttribute('data-bgroup'); renderAll(); return; }

    var per = hit('[data-period]');
    if (per) {
      S.period = per.getAttribute('data-period');
      if (S.period === 'custom') {
        if (!S.from) { S.from = dstr(addDays(today(), -6)); S.to = dstr(today()); }
        $('cFrom').value = S.from; $('cTo').value = S.to;
      }
      renderAll();
      return;
    }
    var fst = hit('[data-fst]');
    if (fst) { S.fStatus = fst.getAttribute('data-fst'); renderAll(); return; }
    var fpr = hit('[data-fpr]');
    if (fpr) { S.fPrio = fpr.getAttribute('data-fpr'); renderAll(); return; }
    var ftag = hit('[data-ftag]');
    if (ftag) { S.fTag = ftag.getAttribute('data-ftag'); renderAll(); return; }

    var cdim = hit('[data-caldim]');
    if (cdim) { S.calDim = cdim.getAttribute('data-caldim'); renderAll(); return; }
    var cnav = hit('[data-calnav]');
    if (cnav) { shiftCal(Number(cnav.getAttribute('data-calnav'))); return; }
    if (hit('[data-caltoday]')) { S.calDate = new Date(); renderAll(); return; }

    if (hit('[data-clearsel]')) { S.selId = ''; renderAll(); return; }

    var pick = hit('[data-pick]');
    if (pick) {
      var pid2 = pick.getAttribute('data-pick');
      S.selId = (S.selId === pid2) ? '' : pid2;
      renderAll();
      return;
    }

    var mv = hit('[data-move]');
    if (mv) { moveTask(mv.getAttribute('data-mid'), Number(mv.getAttribute('data-move'))); return; }

    var insBtn = hit('[data-ins]');
    if (insBtn) {
      var pos = Number(insBtn.getAttribute('data-ins'));
      var mains2 = currentMains();
      ensureSortOrders(mains2, function () {
        S.pendingOrder = sortOrderForIndex(pos);
        openTaskForm(null, null);
      });
      return;
    }

    var setst = hit('[data-setst]');
    if (setst) {
      var holder = setst.parentNode, hp = '';
      while (holder && holder.getAttribute) {
        hp = holder.getAttribute('data-pid') || '';
        if (hp) break;
        holder = holder.parentNode;
      }
      if (hp) {
        switchStatus(hp,setst.getAttribute('data-setst'),function(err){if(err)return;toast('状态已保存');reload();});
      }
      return;
    }

    var dl = hit('[data-del]');
    if (dl) {
      var did = dl.getAttribute('data-del'), dtk = byId(did);
      if (!dtk) return;
      var ks = visibleKids(did);
      if (!confirm('把「' + (dtk['任务标题'] || '') + '」移入回收站？' +
          (ks.length ? '\n其下 ' + ks.length + ' 个子任务也会一起移入。' : '') +
          '\n\n可在回收站手动恢复；不会自动清理。')) return;
      removeTask(did, function () {
        reload();
        showUndo(dtk['任务标题'] || '任务', [did]);
      });
      return;
    }

    var dtag = hit('[data-deltag]');
    if (dtag && !inMaskOrDrawer(el)) {
      delLink(dtag.getAttribute('data-deltag'), function () { toast('已移除标签'); reload(); });
      return;
    }

    var ico = hit('[data-icon]');
    if (ico) { openIconPicker(ico.getAttribute('data-icon'), function () {}); return; }

    var op = hit('[data-open]');
    if (op) { openTaskDetail(op.getAttribute('data-open')); return; }

    var sub = hit('[data-subof]');
    if (sub) { openTaskForm(null, sub.getAttribute('data-subof')); return; }

    if (hit('[data-tagmgr]')) { openTagManager(); return; }

    var day = hit('[data-day]');
    if (day && !inMaskOrDrawer(el)) { openDayAgenda(day.getAttribute('data-day')); return; }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute('data-addtag') && el.value) {
      var tid = el.getAttribute('data-addtag'), nm = el.value, tk = byId(tid);
      if (!tk) return;
      addLink({
        '关联标题': { text: (tk['任务标题'] || '') + ' · ' + nm },
        '任务ID': { text: tid }, '任务标题': { text: tk['任务标题'] || '' },
        '标签名称': { text: nm }, '创建时间': { date: nowISO() }
      }, function () { toast('已添加标签「' + nm + '」'); reload(); });
      return;
    }
    if (el.id === 'cFrom' || el.id === 'cTo') {
      S.from = $('cFrom').value; S.to = $('cTo').value; renderAll();
    }
  });

  var kwTimer = null;
  document.addEventListener('input', function (e) {
    if (e.target.id === 'kw') {
      if (kwTimer) clearTimeout(kwTimer);
      kwTimer = setTimeout(function () { S.kw = ($('kw').value || '').trim(); renderAll(); }, 200);
    }
  });

  function shiftCal(dir) {
    var d = new Date(S.calDate);
    if (S.calDim === 'week') { d.setDate(d.getDate() + 7 * dir); }
    else if (S.calDim === 'month') { d.setMonth(d.getMonth() + dir); }
    else { d.setMonth(d.getMonth() + 3 * dir); }
    S.calDate = d;
    renderAll();
  }
  function cycleCalDim() {
    S.tab = 'task';
    S.view = (S.view === 'week') ? 'month' : 'week';
    S.calDim = S.view;
    renderAll();
    toast((S.view === 'week' ? '周视图' : '月视图'));
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('modalRoot').firstChild) {
        var masks = $('modalRoot').querySelectorAll('.mask');
        if (masks.length > 1) {
          var top = masks[masks.length - 1];
          if (top.__close) { top.__close(); }
        } else { closeModal(); agScope = null; }
        e.preventDefault();
        return;
      }
      if ($('drawerRoot').firstChild) { closeDrawer(); e.preventDefault(); return; }
      return;
    }
    if (inInput(document.activeElement)) { return; }
    if (e.ctrlKey || e.metaKey || e.altKey) { return; }
    var k = e.key;
    if (k === '/') { e.preventDefault(); openCreate(S.tab === 'note' ? { kind: 'note' } : { parent: ctxParent() }); return; }
    if (k === 'b' || k === 'B') { S.tab = (S.tab === 'note' ? 'task' : 'note'); renderAll(); return; }
    if (k === '1') { S.tab = 'task'; S.view = 'month'; S.calDim = 'month'; renderAll(); return; }
    if (k === '2') { S.tab = 'task'; S.view = 'board'; renderAll(); return; }
    if (k === '3') { S.tab = 'note'; renderAll(); return; }
    if (k === 't' || k === 'T') { S.calDate = new Date(); S.period = 'today'; renderAll(); return; }
    if (k === 'r' || k === 'R') { openRecycle(); return; }
    if (k === '?') { openHelp(); return; }
    if (k === 'Enter') { if (S.selId) { openTaskDetail(S.selId); } return; }
  });
  function toggleNotes() {
    if ($('drawerRoot').firstChild) { closeDrawer(); } else { openNotes(true, null); }
  }

  $('btnNew').addEventListener('click', function () {
    /* 当前在便签 tab → 默认新建便签；在任务 tab → 默认新建任务 */
    if (S.tab === 'note') { openCreate({ kind: 'note' }); return; }
    openCreate({ parent: ctxParent() });
  });

  /* 右上角菜单：搜索 / 综合筛选 / 周报 / 操作提示 / 皮肤 / 标签 / 回收站 */
  function renderMenuPop() {
    $('menuPop').innerHTML =
      '<div id="ctxBox"></div>' +
      '<div class="menu-search">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" ' +
          'stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>' +
        '<input type="text" id="kw" placeholder="搜索任务 / 描述 / 标签">' +
      '</div>' +
      '<div class="menu-sep"></div>' +
      '<button class="menu-item" data-od="data"><span class="mk">↗</span>数据、备份与连接</button>' +
      '<button class="menu-item" data-od="search"><span class="mk">⌕</span>全局搜索 <small>Ctrl K</small></button>' +
      '<button class="menu-item" id="btnReport"><span class="mk">📊</span>生成周报</button>' +
      '<button class="menu-item" id="btnHelp"><span class="mk">⌨</span>操作提示与快捷键</button>' +
      '<button class="menu-item" id="btnTheme"><span class="mk">🎨</span>皮肤与背景</button>' +
      '<button class="menu-item" id="btnTagMgr"><span class="mk">🏷</span>标签管理</button>' +
      '<button class="menu-item" id="btnRecycle"><span class="mk">🗑</span>回收站</button>';
  }
  function toggleMenu(force) {
    var p = $('menuPop');
    var show = (force === undefined) ? (p.style.display === 'none') : !!force;
    p.style.display = show ? 'flex' : 'none';
    if (show) {
      var k = $('kw'); if (k) { k.value = S.kw || ''; }
    }
  }
  /*__ONEDAY_ENHANCEMENTS__*/
  renderMenuPop();
  $('btnMenu').addEventListener('click', function (e) { e.stopPropagation(); toggleMenu(); });
  $('menuPop').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.id === 'btnReport') { toggleMenu(false); openReport(); return; }
    if (b.id === 'btnHelp') { toggleMenu(false); openHelp(); return; }
    if (b.id === 'btnTheme') { toggleMenu(false); openSettings(); return; }
    if (b.id === 'btnTagMgr') { toggleMenu(false); openTagManager(); return; }
    if (b.id === 'btnRecycle') { toggleMenu(false); openRecycle(); return; }
  });
  document.addEventListener('click', function (e) {
    var p = $('menuPop');
    if (!p || p.style.display === 'none') return;
    if (e.target.closest && e.target.closest('.menu-wrap')) return;
    toggleMenu(false);
  });
  bindTodoView();
  bindNotesView();

  /* =====================================================================
     19. 启动
     ===================================================================== */
  function init() {
    var local = readLocalBg();
    applyBg(mergeBg(local || { type: 'solid', value: '#f5f4f0', name: '纸间留白', panel: .96 }), true);

    var t = today(), wd = (t.getDay() + 6) % 7;
    S.from = dstr(addDays(t, -wd));
    S.to = dstr(addDays(t, -wd + 6));
    if (S.calDim !== 'week' && S.calDim !== 'month' && S.calDim !== 'quarter') { S.calDim = 'month'; }

    if (!dbReady) { S.loading = false; renderAll(); return; }
    if (typeof db.onUpdated === 'function') {
      var timer = null;
      db.onUpdated(function (payload) {
        var ids = (payload && payload.databaseIds) || [];
        var mine = ['oneday-tasks', 'oneday-logs', 'oneday-tags',
                    'oneday-links', 'oneday-notes', 'oneday-sets',
                    'oneday-cal'];
        var hitMine = false;
        for (var i = 0; i < ids.length; i++) { if (mine.indexOf(ids[i]) > -1) { hitMine = true; } }
        if (!hitMine) return;
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () { timer = null; reload(); }, 350);
      });
    }
    restorePending();
    reload();
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();
</script>
</body>
</html>
