<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneDay · 从容地过好每一天</title>
<style>
/* ============================================================
   设计令牌：所有面板走半透明 + 毛玻璃，保证叠在任何背景上都好看
   ============================================================ */
:root{
  --ui-text:#141821; --ui-muted:#6a7183; --ui-faint:#9198a8;
  --panel:rgba(255,255,255,.74);
  --panel-2:rgba(255,255,255,.5);
  --panel-solid:#ffffff;
  --line:rgba(20,24,33,.09);
  --line-2:rgba(20,24,33,.06);
  --accent:#5b5bd6; --accent-2:#8b5cf6;
  --accent-soft:rgba(91,91,214,.13);
  --accent-text:#4a4ac4;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 14px 36px -18px rgba(16,24,40,.3);
  --shadow-lg:0 24px 70px -22px rgba(16,24,40,.42);
  --blur:20px; --scrim:0;
  --r:14px; --r-sm:10px;
  --seg-bg:rgba(20,24,33,.055);
  --card-hover:rgba(255,255,255,.5);
  --strong-line:rgba(20,24,33,.16);
}
html[data-theme="dark"]{
  --ui-text:#eef1f8; --ui-muted:#a3acbe; --ui-faint:#7d869a;
  --panel:rgba(21,24,33,.66);
  --panel-2:rgba(21,24,33,.42);
  --panel-solid:#1a1e28;
  --line:rgba(255,255,255,.11);
  --line-2:rgba(255,255,255,.07);
  --accent:#9b9bff; --accent-2:#c4a6ff;
  --accent-soft:rgba(155,155,255,.18);
  --accent-text:#b8b8ff;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 44px -20px rgba(0,0,0,.75);
  --shadow-lg:0 30px 80px -26px rgba(0,0,0,.85);
  --seg-bg:rgba(255,255,255,.08);
  --card-hover:rgba(255,255,255,.06);
  --strong-line:rgba(255,255,255,.22);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#f4f5f8;color:var(--ui-text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  transition:color .28s ease;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(130,138,155,.35);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(130,138,155,.6);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   背景层：纯色 / 渐变 / 图片 / 动态 + 遮罩
   ============================================================ */
#bgLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:#f4f5f8;transition:background .4s ease}
#bgLayer .bg-scrim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s ease}
/* 注意：.bg-anim 不能带 #bgLayer 前缀——外观面板里的动态缩略图也要靠它定位与动起来 */
.bg-anim{position:absolute;inset:-25%;will-change:transform,opacity;pointer-events:none}

/* 动态背景 1 · 极光流动 */
@keyframes auroraA{0%{transform:translate(-24%,-18%) scale(1.4)}50%{transform:translate(22%,18%) scale(1.8)}100%{transform:translate(-24%,-18%) scale(1.4)}}
@keyframes auroraB{0%{transform:translate(20%,14%) scale(1.65)}50%{transform:translate(-20%,-22%) scale(1.25)}100%{transform:translate(20%,14%) scale(1.65)}}
/* 动态背景 2 · 星云旋转 */
@keyframes nebulaSpin{from{transform:rotate(0deg) scale(1.65)}to{transform:rotate(360deg) scale(1.65)}}
/* 动态背景 3 · 呼吸流光 */
@keyframes breatheFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* 动态背景 4 · 网格脉冲 */
@keyframes gridPulse{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
/* 动态背景 5 · 星河 */
@keyframes starDrift{from{transform:translate3d(0,0,0) scale(1.45)}to{transform:translate3d(0,-24%,0) scale(2)}}
/* 公共色相漂移：让浅色系动态背景也能明显看出颜色在流动 */
@keyframes hueDrift{0%{filter:hue-rotate(0deg) saturate(150%)}50%{filter:hue-rotate(64deg) saturate(185%)}100%{filter:hue-rotate(0deg) saturate(150%)}}
@keyframes swayX{0%{transform:translateX(-16%)}50%{transform:translateX(16%)}100%{transform:translateX(-16%)}}
/* 系统「减弱动效」时不再一刀切停掉，只适度放慢并保留明显流动；用户也可在外观面板里强制全速 */
@media (prefers-reduced-motion:reduce){
  .bg-anim{animation-duration:26s!important;animation-timing-function:ease-in-out!important}
  .bg-anim.hue{animation-duration:34s!important}
}
html[data-motion="force"] .bg-anim{animation-duration:initial;animation-timing-function:initial}

/* ============================================================
   布局
   ============================================================ */
#app{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden}

/* ---------- 侧栏 ---------- */
.side{width:256px;flex:0 0 256px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  border-right:1px solid var(--line)}
.brand{padding:16px 16px 10px;display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 14px -4px rgba(91,91,214,.6)}
.brand-txt{font-weight:680;font-size:14.5px;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--ui-faint);margin-top:1px}
.side-scroll{flex:1;overflow-y:auto;padding:0 10px 10px;overscroll-behavior:contain}
.nav-sec{margin-top:13px}
.nav-title{font-size:10.5px;font-weight:700;color:var(--ui-faint);letter-spacing:1px;
  text-transform:uppercase;padding:0 8px 5px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:9px;
  text-align:left;color:var(--ui-text);font-size:13px;transition:background .14s;opacity:.9}
.nav-item:hover{background:var(--card-hover);opacity:1}
.nav-item.on{background:var(--accent-soft);color:var(--accent-text);font-weight:650;opacity:1}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--ui-faint);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.side-foot{border-top:1px solid var(--line);padding:9px 10px;display:flex;gap:7px;flex-wrap:wrap}
.side-foot button{flex:1 0 44%;padding:8px 4px;border-radius:9px;background:var(--seg-bg);font-size:12px;
  font-weight:600;transition:.14s}
.side-foot button:hover{background:var(--accent-soft);color:var(--accent-text)}

/* 顶栏：左品牌 / 中主导航 / 右菜单 */
.top-row .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding:0}
.top-row .brand .brand-mark{width:32px;height:32px;border-radius:10px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.top-row .brand .brand-mark svg{display:block}
.mainnav{position:relative;display:inline-flex;flex:0 0 auto;background:var(--seg-bg);
  border-radius:999px;padding:3px;gap:0;box-shadow:inset 0 1px 2px rgba(16,24,40,.06)}
.mainnav button{position:relative;z-index:1;min-width:104px;padding:8px 6px;border-radius:999px;
  font-size:13.5px;font-weight:660;color:var(--ui-muted);background:transparent;transition:color .2s}
.mainnav button:hover{color:var(--ui-text)}
.mainnav button.on{color:#fff}
.mn-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 20px -8px rgba(60,60,180,.75);transition:transform .28s cubic-bezier(.22,.61,.36,1)}

/* 二级栏：月/周/看板 + 日期导航 + 标题（合并在一行） */
.taskbar{display:flex;align-items:center;gap:12px;padding:2px 22px 10px;flex-wrap:wrap}
.taskbar .view-seg{flex:0 0 auto}
.taskbar-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.taskbar-title .pt{font-size:15px;font-weight:700;margin:0}
.taskbar-title .pt-sub{font-size:11.5px;color:var(--ui-muted)}

/* 任务子视图切换 月/周/看板 */
.view-seg{display:inline-flex;background:var(--seg-bg);border-radius:11px;padding:3px;gap:2px}
.view-seg button{padding:6px 15px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ui-muted);transition:.15s}
.view-seg button:hover{color:var(--ui-text)}
.view-seg button.on{background:var(--panel-solid);color:var(--ui-text);box-shadow:0 1px 3px rgba(16,24,40,.16)}

/* 日期导航（与二级栏合并） */
.cal-nav{display:inline-flex;align-items:center;gap:2px;background:var(--seg-bg);border-radius:11px;padding:3px}
.cal-nav button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ui-muted);
  transition:.15s;white-space:nowrap;min-width:36px;text-align:center}
.cal-nav button:hover{color:var(--ui-text);background:var(--panel-solid)}

/* 右上角菜单（含综合筛选，可滚动） */
.menu-wrap{position:relative}
.menu-btn{width:38px;height:38px;border-radius:11px;background:var(--seg-bg);display:flex;
  align-items:center;justify-content:center;color:var(--ui-text);transition:.15s}
.menu-btn:hover{background:var(--accent-soft);color:var(--accent-text)}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:70;width:302px;max-height:min(78vh,720px);
  overflow-y:auto;background:var(--panel-solid);border:1px solid var(--strong-line);border-radius:14px;padding:10px;
  box-shadow:0 20px 50px -18px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px}
.menu-pop .ctx-box{margin:0 0 4px}
.menu-filters{border:1px solid var(--line);border-radius:12px;padding:2px 9px 9px;background:var(--panel-2)}
.menu-filters .nav-sec{padding-top:8px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--ui-text);text-align:left;transition:.13s}
.menu-item:hover{background:var(--accent-soft);color:var(--accent-text)}
.menu-item .mk{width:18px;text-align:center}
.menu-search{position:relative;margin-bottom:2px}
.menu-search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel-2);font-size:13px;outline:none;box-sizing:border-box}
.menu-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.menu-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.menu-sep{height:1px;background:var(--line);margin:3px 2px}

/* 月视图：整个格子作为容器，注入分层液体（已完成 / 待完成 / 空） */
.cell-liquid{position:absolute;inset:0;z-index:0;pointer-events:none}
.cell-liquid-svg{display:block;width:100%;height:100%;transform-origin:50% 100%;
  animation:liqSway var(--swT,7s) ease-in-out infinite;animation-delay:var(--swD,0s)}
.cal-cell .dn,.cal-cell .chips{position:relative;z-index:1}
.cal-cell .dn{text-shadow:0 1px 2px var(--panel-solid)}
/* 玻璃高光拂过：每格随机延时，偶尔一扫而过 */
.cal-cell::after{content:'';position:absolute;top:-35%;bottom:-35%;left:-45%;width:46%;z-index:3;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  opacity:0;transform:translateX(-140%) skewX(-14deg);
  animation:cellSheen var(--shT,9s) ease-in-out infinite;animation-delay:var(--shD,0s)}
@keyframes cellSheen{
  0%{opacity:0;transform:translateX(-140%) skewX(-14deg)}
  8%{opacity:.9}
  18%{opacity:0;transform:translateX(140%) skewX(-14deg)}
  100%{opacity:0;transform:translateX(140%) skewX(-14deg)}}
@keyframes liqSway{0%,100%{transform:translateX(-1.4%) scaleY(1)}50%{transform:translateX(1.4%) scaleY(1.012)}}
/* 今天的角标 */
.cal-cell.today::before{content:'今天';position:absolute;right:5px;bottom:5px;z-index:4;font-size:9.5px;font-weight:800;
  letter-spacing:.5px;color:#fff;background:var(--accent-text);border-radius:20px;padding:1px 7px;
  box-shadow:0 3px 9px -2px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){
  .cal-cell::after,.cell-liquid-svg{animation:none!important}
}

/* 议程：底部大抽屉（左右不留空、贴底、上滑推入） */
.dlg.ag-sheet{width:100%;max-width:none;border-radius:22px 22px 0 0;border-bottom:none;margin:0;
  max-height:94vh;animation:sheetUp .3s cubic-bezier(.22,.61,.36,1)}
/* 顶部标题栏：日期星期 + 类型标签（可点） + 玻璃方块 */
.ag-hd{align-items:center;gap:12px}
.ag-hd-left{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.ag-hd-left h3{margin:0}
.ag-wd{font-weight:500;color:var(--ui-muted);font-size:13px}
.day-tag{border:none;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700;
  cursor:pointer;transition:filter .15s,transform .15s;white-space:nowrap}
.day-tag:hover{filter:brightness(.95);transform:translateY(-1px)}
.ag-hd-glass{width:46px;height:46px;border-radius:12px;overflow:hidden;position:relative;flex:0 0 auto;
  background:var(--panel-2);border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(16,24,40,.08)}
.ag-hd-glass .cell-liquid-svg{width:100%;height:100%}

/* 子任务时间轴：展开时与主时间轴合计占页面 1/2，把空间留给详情 */
.agenda.has-sub .ag-l{flex:0 0 26%;max-width:26%}
.ag-sub{flex:0 0 24%;max-width:24%;min-width:0;display:none;flex-direction:column;border-left:1px solid var(--line)}
.ag-sub-hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ag-sub-t{font-size:12px;font-weight:660;color:var(--ui-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-sub-n{font-size:10.5px;color:var(--ui-muted);background:var(--seg-bg);border-radius:20px;padding:1px 8px}
.tl.tl-sub .tl-gutter{width:30px}
.tl.tl-sub .tl-grid{left:30px}
.tl.tl-sub .tl-cards{left:30px}
.tl.tl-sub .tl-now{left:28px}
.tl.tl-sub .tl-hour{font-size:9px;padding-right:3px}
.tl-empty{position:absolute;left:6px;right:6px;top:44px;text-align:center;font-size:11.5px;
  color:var(--ui-faint);pointer-events:none}
.ctx-box{margin:0 10px 6px;padding:7px 10px;border-radius:10px;background:var(--accent-soft);
  font-size:11.5px;display:flex;align-items:center;gap:7px}
.ctx-box b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-box .x{margin-left:auto;color:var(--ui-muted);font-size:13px;line-height:1}
.ctx-box .x:hover{color:var(--ui-text)}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{padding:14px 22px 10px}
.top-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
h1.pt{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px}
.pt-sub{font-size:12px;color:var(--ui-muted);margin-top:2px}
.grow{flex:1}
.search{position:relative}
.search input{width:186px;padding:8px 12px 8px 31px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel-2);backdrop-filter:blur(10px);outline:none;transition:.18s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);width:230px;
  background:var(--panel)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.42}
.btn{border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:8px 15px;
  box-shadow:0 4px 16px -6px rgba(91,91,214,.75)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--panel-2);border:1px solid var(--line);padding:7px 12px;backdrop-filter:blur(10px)}
.btn-ghost:hover{background:var(--panel);border-color:var(--strong-line)}
.ico-btn{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ui-faint);flex:0 0 auto;transition:.14s;font-size:13px}
.ico-btn:hover{background:var(--seg-bg);color:var(--ui-text)}
.ico-btn.danger:hover{background:rgba(220,38,38,.14);color:#e05252}

.mode-switch{display:inline-flex;background:var(--seg-bg);border-radius:11px;padding:3px;gap:2px;
  backdrop-filter:blur(10px)}
.mode-switch button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ui-muted);
  transition:.14s;display:flex;align-items:center;gap:5px}
.mode-switch button:hover{color:var(--ui-text)}
.mode-switch button.on{background:var(--panel-solid);color:var(--ui-text);box-shadow:0 1px 3px rgba(16,24,40,.16)}

/* 看板顶部统计：固定一行不换行，空间不足时横向滚动 */
.kpis{display:flex;flex-wrap:nowrap;gap:8px;padding:0 22px 10px;overflow-x:auto;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;
  backdrop-filter:blur(var(--blur)) saturate(150%);box-shadow:var(--shadow)}
.kpi .k{font-size:10.5px;color:var(--ui-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:20px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--accent)}

.host{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 96px;overscroll-behavior:contain}
.host.plain{overflow:hidden;padding:0 22px 84px;display:flex;flex-direction:column}

.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);
  padding:48px 20px;text-align:center;color:var(--ui-muted);backdrop-filter:blur(var(--blur))}
.empty b{display:block;color:var(--ui-text);font-size:15px;margin-bottom:6px;font-weight:650}

/* ============================================================
   列表卡片视图
   ============================================================ */
.grp{margin-bottom:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:relative;
  box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(var(--blur)) saturate(150%);
  transition:border-color .15s, box-shadow .2s, transform .18s}
.card:hover{border-color:var(--strong-line);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,#cbd0dc)}
.card[data-selected="1"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.pick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--strong-line);
  margin-top:2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;
  color:transparent;transition:.14s;background:var(--panel-2)}
.pick:hover{border-color:var(--accent);color:var(--accent)}
.card[data-selected="1"] .pick{background:var(--accent);border-color:var(--accent);color:#fff}
.card .hd{display:flex;align-items:flex-start;gap:9px;padding:11px 13px 8px 15px}
.tico{font-size:16px;line-height:1.4;flex:0 0 auto;cursor:pointer;user-select:none;border-radius:6px;padding:0 1px}
.tico:hover{background:var(--seg-bg)}
.ttl{font-weight:640;font-size:14.5px;line-height:1.45;cursor:pointer;flex:1;min-width:0;word-break:break-word;
  transition:color .12s}
.ttl:hover{color:var(--accent-text)}
.ttl.done{color:var(--ui-faint);text-decoration:line-through;text-decoration-thickness:1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:20px;
  font-size:11.5px;font-weight:650;white-space:nowrap;flex:0 0 auto;border:1px solid transparent}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:9px;padding:2px;gap:1px;flex:0 0 auto}
.seg button{width:23px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;color:var(--ui-faint);transition:.12s}
.seg button:hover{background:var(--panel-solid);color:var(--ui-text)}
.seg button.on{background:var(--panel-solid);box-shadow:0 1px 3px rgba(16,24,40,.18)}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:0 13px 9px 15px;font-size:11.5px;color:var(--ui-muted)}
.meta .mi{display:inline-flex;align-items:center;gap:4px}
.meta .mi.over{color:#e05252;font-weight:650}
.meta .mi.soon{color:#d98324;font-weight:650}
.bar{width:70px;height:5px;border-radius:4px;background:var(--seg-bg);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:20px;font-size:10.5px;
  font-weight:650;border:1px solid transparent;white-space:nowrap}
.tag .x{opacity:.45;font-size:11px;line-height:1;padding:0 1px}
.tag .x:hover{opacity:1}
.tag-add{font-size:10.5px;color:var(--ui-faint);border:1px dashed var(--line);border-radius:20px;padding:1px 8px;
  transition:.12s;background:transparent;outline:none;max-width:92px}
.tag-add:hover{color:var(--accent-text);border-color:var(--accent)}
.subs{border-top:1px solid var(--line-2);background:var(--panel-2)}
.sub{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 21px;border-bottom:1px solid var(--line-2)}
.sub:last-child{border-bottom:none}
.sub:hover{background:var(--card-hover)}
.sub .st{width:13px;text-align:center;font-size:9.5px;flex:0 0 auto}
.sub .nm{font-size:12.5px;flex:1;min-width:0;cursor:pointer;word-break:break-word}
.sub .nm.done{color:var(--ui-faint);text-decoration:line-through}
.sub .dt{font-size:11px;color:var(--ui-faint);white-space:nowrap}
.sub-add{padding:6px 13px 7px 21px;font-size:11.5px;color:var(--ui-faint);width:100%;text-align:left}
.sub-add:hover{color:var(--accent-text)}

/* ============================================================
   看板视图
   ============================================================ */
.board{display:flex;gap:12px;height:100%;overflow-x:auto;padding-bottom:6px;align-items:stretch}
.bcol{flex:0 0 284px;display:flex;flex-direction:column;border-radius:var(--r);
  background:var(--panel-2);border:1px solid var(--line);backdrop-filter:blur(var(--blur)) saturate(150%);
  max-height:100%;transition:background .18s,border-color .18s}
.bcol.over{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bcol-hd{padding:10px 12px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:680;
  border-bottom:1px solid var(--line-2);flex:0 0 auto}
.bcol-hd .cnt{margin-left:auto;font-size:11px;color:var(--ui-faint);background:var(--seg-bg);
  padding:1px 8px;border-radius:20px;font-variant-numeric:tabular-nums}
.bcol-bd{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:70px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px 9px 12px;
  cursor:grab;transition:.16s;box-shadow:0 1px 2px rgba(16,24,40,.06);position:relative}
.bcard::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:2px;background:var(--sc,#cbd0dc)}
.bcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--strong-line)}
.bcard.dragging{opacity:.35;transform:rotate(2deg)}
.bcard[data-selected="1"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bcard .bt{display:flex;align-items:flex-start;gap:6px;font-size:13px;font-weight:620;line-height:1.42;
  word-break:break-word;cursor:pointer;padding-right:16px}
.bcard .bm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--ui-muted)}
.bcard .pick{position:absolute;right:7px;top:8px;width:15px;height:15px;margin:0;font-size:9px}
.bcol-empty{font-size:11.5px;color:var(--ui-faint);text-align:center;padding:16px 6px;border:1px dashed var(--line);
  border-radius:var(--r-sm)}

/* ============================================================
   日历视图
   ============================================================ */
.cal{display:flex;flex-direction:column;height:100%;min-height:0}
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex:0 0 auto;flex-wrap:wrap}
.cal-nav{display:inline-flex;background:var(--seg-bg);border-radius:9px;padding:2px}
.cal-nav button{width:28px;height:26px;border-radius:7px;color:var(--ui-muted);display:flex;align-items:center;
  justify-content:center;font-size:13px}
.cal-nav button:hover{background:var(--panel-solid);color:var(--ui-text)}
.cal-title{font-size:14px;font-weight:680;min-width:150px}
.cal-grid{flex:1;min-height:0;display:grid;gap:6px}
.cal-grid.w7{grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-grid.m6{grid-template-rows:auto repeat(6,minmax(62px,1fr))}
.cal-cell{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px;
  min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(12px);
  transition:.14s;cursor:pointer}
.cal-cell:hover{border-color:var(--accent);background:var(--panel)}
.cal-cell.out{opacity:.4}
/* 今天：整格强调，一眼可见 */
.cal-cell.today{border-color:var(--accent-text);background:var(--accent-soft);
  box-shadow:inset 0 0 0 2px var(--accent-text),0 0 0 3px var(--accent-soft)}
.cal-cell .dn{font-size:13.5px;font-weight:700;color:var(--ui-strong);display:flex;align-items:center;gap:5px;flex:0 0 auto}
.cal-cell.today .dn{color:var(--accent-text);font-weight:800}
.cal-cell .dn .wd{font-weight:600;color:var(--ui-faint);font-size:11px}
.cal-chip{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px;font-size:10.5px;
  font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  border:1px solid transparent;transition:.12s;flex:0 0 auto;max-width:100%}
.cal-chip:hover{filter:brightness(1.06)}
.cal-chip span{overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:10px;color:var(--ui-faint);padding-left:4px;cursor:pointer;flex:0 0 auto}
.cal-more:hover{color:var(--accent-text)}
.cal-head{font-size:12px;font-weight:700;color:var(--ui-muted);text-align:center;padding:2px 0;letter-spacing:.5px}
.cal-q{display:flex;gap:10px;flex:1;min-height:0}
.qmonth{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.qmonth-t{font-size:11.5px;font-weight:680;margin-bottom:5px;color:var(--ui-muted);flex:0 0 auto}
.day-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto}

/* ============================================================
   弹窗 / 抽屉
   ============================================================ */
.mask{position:fixed;inset:0;background:rgba(12,16,24,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:60;
  animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;width:100%;
  box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.8,.3,1);margin:auto;overflow:hidden;
  max-height:100%;display:flex;flex-direction:column}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.dlg.w480{max-width:480px}.dlg.w620{max-width:620px}.dlg.w760{max-width:760px}
.dlg.w980{max-width:980px}.dlg.w1120{max-width:1120px}
.dlg-hd{display:flex;align-items:center;gap:10px;padding:14px 19px;border-bottom:1px solid var(--line);
  flex:0 0 auto}
.dlg-hd h3{margin:0;font-size:15px;font-weight:680;display:flex;align-items:center;gap:8px}
.dlg-bd{padding:16px 19px;overflow-y:auto;flex:1;min-height:0}
.dlg-ft{padding:12px 19px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;
  background:var(--panel-2);flex:0 0 auto}

/* 底部抽屉式弹窗（新建）：贴满宽度、贴底、自下向上推入 */
.mask.sheet-mask{align-items:flex-end;justify-content:center;padding:0;background:rgba(12,16,24,.34)}
.dlg.sheet{max-width:none;width:100%;border-radius:20px 20px 0 0;border-bottom:none;margin:0;
  max-height:94vh;animation:sheetUp .28s cubic-bezier(.22,.61,.36,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dlg.sheet .dlg-hd{padding:14px 18px 12px}
.dlg.sheet .dlg-bd{padding:14px 18px 4px}
.dlg.sheet .dlg-ft{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.btn-sheet{flex:1;padding:13px 16px;border-radius:999px;font-size:14px;font-weight:680;
  transition:transform .15s,box-shadow .15s,background .15s;border:none}
.btn-sheet.cancel{background:var(--seg-bg);color:var(--ui-text)}
.btn-sheet.cancel:hover{background:var(--accent-soft);color:var(--accent-text)}
.btn-sheet.ok{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 12px 26px -12px rgba(60,60,180,.8)}
.btn-sheet.ok:hover{transform:translateY(-1px)}
.btn-sheet:disabled{opacity:.62;transform:none;cursor:default}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:11.5px;font-weight:680;color:var(--ui-muted);margin-bottom:5px}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld input[type=url],
.fld select,.fld textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
  outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel-solid)}
.fld textarea{resize:vertical;min-height:62px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-opt{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:620;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ui-muted);transition:.13s}
.chip-opt:hover{border-color:var(--accent)}
.chip-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.st-pick{display:flex;flex-wrap:wrap;gap:6px}
.st-pick button{padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:620;border:1px solid var(--line);
  background:var(--panel-2);transition:.13s}
.st-pick button:hover{transform:translateY(-1px)}
.sect{border-top:1px dashed var(--line);margin-top:15px;padding-top:13px}
.sect-h{display:flex;align-items:center;font-size:12.5px;font-weight:680;margin-bottom:8px;color:var(--ui-muted)}
.mini{font-size:11.5px;color:var(--accent-text);font-weight:650;background:none}
.mini:hover{text-decoration:underline}
.hint{font-size:11.5px;color:var(--ui-faint);line-height:1.65}
.notice{background:var(--accent-soft);border:1px solid var(--accent-soft);color:var(--accent-text);
  border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.6}
/* ---------- 极简新建表单 ---------- */
.fld.quick{margin-bottom:14px}
.fld.quick>label{font-size:12px;margin-bottom:6px}
.fld.quick input[type=text]{font-size:16px;font-weight:620;padding:12px 13px}
.fld.quick textarea{min-height:132px;line-height:1.7;font-size:13.5px}
.quick-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;
  color:var(--ui-faint);line-height:1.6;border-top:1px dashed var(--line);padding-top:11px}
.diag{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--seg-bg);
  font-size:11.5px;line-height:1.75;font-family:ui-monospace,Menlo,Consolas,monospace;
  word-break:break-all;max-height:200px;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:680;color:var(--ui-muted);font-size:11px;padding:6px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;text-align:right}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  animation:rot .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- 任务详情弹窗 ---------- */
.td-head{display:flex;align-items:flex-start;gap:10px;padding:14px 19px;border-bottom:1px solid var(--line);
  flex:0 0 auto}
.td-icon{font-size:23px;line-height:1.2;cursor:pointer;border-radius:9px;padding:2px 5px;transition:.14s;
  flex:0 0 auto}
.td-icon:hover{background:var(--seg-bg)}
.td-titlewrap{flex:1;min-width:0}
.td-title{font-size:17px;font-weight:690;border:none;background:transparent;outline:none;
  padding:3px 4px;border-radius:8px;width:100%}
.td-title:focus{background:var(--seg-bg)}
.td-sub{font-size:11px;color:var(--ui-faint);padding-left:5px;margin-top:1px}
.td-body{display:flex;flex:1;min-height:0}
.td-side{width:284px;flex:0 0 284px;border-right:1px solid var(--line);padding:14px 16px;overflow-y:auto}
.td-main{flex:1;min-width:0;padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column}
/* 任务详情：上下结构（上=编辑器，下=属性栏） */
.td-stack{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
/* 三页签（任务内容 / 任务属性 / 任务日志）+ 左右滑动 */
.td-tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);flex:0 0 auto;
  background:var(--panel-2);position:relative;z-index:2}
.td-tabs button{flex:1;padding:9px 6px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:650;
  color:var(--ui-muted);background:transparent;transition:.16s;white-space:nowrap}
.td-tabs button:hover{color:var(--ui-text)}
.td-tabs button.on{background:var(--panel-solid);color:var(--accent-text);box-shadow:inset 0 -2px 0 var(--accent-text)}
.td-swipe{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:pan-y}
.td-panes{display:flex;height:100%;transition:transform .28s cubic-bezier(.22,.61,.36,1);will-change:transform}
.td-pane{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.td-editor{padding:14px 18px 10px;display:flex;flex-direction:column;flex:1;min-height:0}
.td-editor .md-wrap{flex:1;min-height:180px}
/* 属性页：单列排布，一行一项 */
.td-props{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;background:transparent}
.td-props .prop{display:flex;flex-direction:column;gap:6px;min-width:0}
.td-props .prop>label{font-size:11px;font-weight:700;color:var(--ui-muted);letter-spacing:.3px}
.td-props input[type=date],.td-props select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel-solid);font-size:13px;outline:none;min-width:0;width:100%;box-sizing:border-box}
.td-props input[type=date]:focus,.td-props select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.td-pane .sect{margin-top:14px;border-top:1px dashed var(--line);padding-top:13px}
.td-pane .sect:first-child{margin-top:0;border-top:none;padding-top:0}
.td-extra{padding:2px 19px 18px;border-top:1px solid var(--line)}
.td-extra .sect{margin-top:12px}
.side-f{margin-bottom:11px}
.side-f>label{display:block;font-size:10.5px;font-weight:700;color:var(--ui-faint);letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:5px}
.side-f input,.side-f select{width:100%;padding:6px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel-2);outline:none;font-size:12.5px}
.side-f input:focus,.side-f select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.logline{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11.5px;
  border-bottom:1px solid var(--line-2)}
.logline:last-child{border-bottom:none}
.logline .t{color:var(--ui-muted);font-variant-numeric:tabular-nums}
.logline .d{margin-left:auto;font-weight:670;font-variant-numeric:tabular-nums}

/* ---------- Markdown ---------- */
.md-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;background:var(--panel-2)}
.md-tools{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);
  background:var(--panel-2);flex-wrap:wrap;flex:0 0 auto}
.md-tools button{min-width:26px;height:26px;padding:0 6px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--ui-muted);transition:.12s;font-weight:600}
.md-tools button:hover{background:var(--panel-solid);color:var(--ui-text)}
.md-tools .sep{width:1px;height:16px;background:var(--line);margin:0 4px;flex:0 0 auto}
.md-tools .tab{padding:0 10px;font-size:11.5px}
.md-tools .tab.on{background:var(--panel-solid);color:var(--accent-text)}
.md-edit{flex:1;min-height:170px;width:100%;border:none;outline:none;resize:none;padding:12px 14px;
  background:transparent;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  font-size:12.5px;line-height:1.72;color:var(--ui-text)}
.md-view{flex:1;min-height:170px;overflow-y:auto;padding:12px 16px;font-size:13.5px;line-height:1.75}
.md-view h1,.md-view h2,.md-view h3,.md-view h4{margin:14px 0 7px;line-height:1.35;font-weight:700}
.md-view h1{font-size:19px}.md-view h2{font-size:16.5px}.md-view h3{font-size:14.5px}.md-view h4{font-size:13.5px}
.md-view h1:first-child,.md-view h2:first-child,.md-view h3:first-child,.md-view h4:first-child{margin-top:0}
.md-view p{margin:8px 0}
.md-view ul,.md-view ol{margin:8px 0;padding-left:22px}
.md-view li{margin:3px 0}
.md-view li.task{list-style:none;margin-left:-18px;display:flex;gap:7px;align-items:flex-start}
.md-view li.task .box{width:14px;height:14px;border:1.5px solid var(--strong-line);border-radius:4px;flex:0 0 auto;
  margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
.md-view li.task.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
.md-view li.task.done{color:var(--ui-faint);text-decoration:line-through}
.md-view blockquote{margin:9px 0;padding:7px 13px;border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 8px 8px 0;color:var(--ui-muted);font-size:13px}
.md-view code{background:var(--seg-bg);padding:1.5px 5px;border-radius:5px;font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.md-view pre{background:var(--seg-bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  overflow-x:auto;margin:9px 0}
.md-view pre code{background:none;padding:0;font-size:12px;line-height:1.6}
.md-view img{max-width:100%;border-radius:10px;margin:7px 0;display:block;border:1px solid var(--line)}
.md-view a{text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.md-view a:hover{border-bottom-color:var(--accent)}
.md-view hr{border:none;border-top:1px solid var(--line);margin:15px 0}
.md-view table{border-collapse:collapse;margin:10px 0;font-size:12.5px;width:100%}
.md-view th,.md-view td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md-view th{background:var(--seg-bg);font-weight:680}
.md-empty{color:var(--ui-faint);font-size:12.5px;padding:20px;text-align:center}

/* ---------- 图标选择 ---------- */
.icon-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-height:212px;overflow-y:auto;
  padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.icon-grid button{aspect-ratio:1;border-radius:8px;font-size:18px;display:flex;align-items:center;
  justify-content:center;transition:.12s}
.icon-grid button:hover{background:var(--accent-soft);transform:scale(1.12)}
.icon-grid button.on{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}

/* ---------- 便签抽屉 ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:408px;max-width:94vw;z-index:70;
  background:var(--panel-solid);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:slideIn .24s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dw-hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:0 0 auto}
.dw-bd{flex:1;overflow-y:auto;padding:13px 18px}
.capture{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-2);margin-bottom:14px}
.capture textarea{width:100%;border:none;background:transparent;outline:none;resize:none;min-height:60px;
  font-size:13px;line-height:1.6}
.capture-bar{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.note{border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;
  background:var(--panel-2);transition:.15s;position:relative}
.note:hover{border-color:var(--strong-line);background:var(--panel)}
.note.pin{border-left:3px solid var(--accent)}
.note .nx{font-size:12.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.note .nm{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10.5px;color:var(--ui-faint);
  flex-wrap:wrap}
.note .nact{display:flex;gap:2px;margin-left:auto}
.note-ttl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ui-faint);
  letter-spacing:.6px;text-transform:uppercase;margin:14px 0 8px}

/* ---------- 外观设置 ---------- */
.bg-swatch{aspect-ratio:1.7;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:.15s;
  position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.1)}
.bg-swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bg-swatch.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bg-swatch b{position:absolute;left:6px;bottom:4px;font-size:9.5px;font-weight:650;opacity:.85;
  background:rgba(255,255,255,.6);color:#222;border-radius:5px;padding:0 4px}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.tabs{display:inline-flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.tabs button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:620;color:var(--ui-muted)}
.tabs button.on{background:var(--panel-solid);color:var(--ui-text);box-shadow:0 1px 3px rgba(16,24,40,.14)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- 其他 ---------- */
.fab{position:fixed;right:22px;bottom:92px;z-index:50;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.fab button{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--panel-solid);border:1px solid var(--line);box-shadow:var(--shadow-lg);
  transition:.18s;backdrop-filter:blur(var(--blur))}
.fab button:hover{transform:translateY(-3px) scale(1.05)}
.fab button.main{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;
  width:54px;height:54px;font-size:22px;box-shadow:0 10px 28px -8px rgba(91,91,214,.8)}

/* ---------- 底部操作区 ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;
  justify-content:center;gap:10px;
  padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.actionbar>*{pointer-events:auto}
.ab-new{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 30px;
  border-radius:26px;font-size:15px;font-weight:680;color:#fff;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 16px 36px -12px rgba(60,60,180,.8);transition:.18s}
.ab-new:hover{transform:translateY(-2px);box-shadow:0 20px 44px -12px rgba(60,60,180,.9)}
.ab-new:active{transform:translateY(0) scale(.985)}
.ab-new .ab-plus{font-size:21px;line-height:1;margin-top:-2px}
.ab-note{width:52px;height:52px;border-radius:50%;font-size:21px;flex:0 0 auto;
  background:var(--panel-solid);border:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;align-items:center;justify-content:center;transition:.18s}
.ab-note:hover{transform:translateY(-2px)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#141821;color:#fff;
  padding:10px 18px;border-radius:11px;font-size:13px;z-index:95;box-shadow:0 14px 40px -12px rgba(0,0,0,.6);
  animation:up .2s ease;max-width:80vw;text-align:center}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:5px;background:var(--seg-bg);border:1px solid var(--line);font-size:11px;font-weight:680;
  font-family:ui-monospace,Menlo,Consolas,monospace}
/* ============================================================
   v3 新增：日历撑满 / 节假日 / 议程弹窗 / 可视化编辑器 / 插入点 / 回收站
   ============================================================ */
/* 让 plain 模式下的视图容器真正吃满剩余高度（此前格子偏小的根因） */
.host.plain{overflow:hidden}
.host.plain #viewHost{flex:1;min-height:0;display:flex;flex-direction:column}
.cal,.board,.board-wrap{flex:1;min-height:0}

/* 日历格子：等分剩余高度 */
.cal-grid{flex:1;min-height:0;display:grid;gap:6px}
.cal-grid.w7{grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-grid.r-auto{grid-template-rows:auto repeat(6,minmax(0,1fr))}
.cal-grid.r-week{grid-template-rows:auto minmax(0,1fr)}
.cal-cell{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.cal-cell .chips{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;flex:1}
.cal-cell .chips::-webkit-scrollbar{width:6px}
.cal-cell.holiday{background:rgba(220,38,38,.09);border-color:rgba(220,38,38,.26)}
.cal-cell.holiday .dn{color:#c0392b}
.cal-cell.workday{background:rgba(37,99,235,.07);border-color:rgba(37,99,235,.2)}
.cal-cell.workday .dn{color:#2563eb}
.cal-cell.leave{background:rgba(21,128,61,.13);border-color:rgba(21,128,61,.34)}
.cal-cell.leave .dn{color:#15803d}
.cal-mark{font-size:10px;font-weight:700;padding:0 6px;border-radius:5px;line-height:16px;white-space:nowrap}
.cal-cell .dn .cal-mark{margin-left:auto}

/* 月视图水容器（已完成 / 计划 两类时长与占比） */
.cal-tanks{display:flex;gap:8px;align-items:flex-end;justify-content:center;flex:1;min-height:0;padding:2px 2px 0}
.cal-tank{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;max-width:46px}
.cal-tank-v{display:flex;align-items:flex-end;justify-content:center;flex:1;min-height:0;width:100%}
.cal-tank-v svg{max-width:100%;height:auto}
.cal-tank-h{font-size:9.5px;color:var(--ui-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cal-grid.tanks .cal-cell{overflow:hidden}

/* 任务议题程弹窗（左右结构） */
.agenda{display:flex;flex:1;min-height:0}
.ag-l{flex:0 0 34%;max-width:34%;min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ag-l-hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.ag-l-bd{flex:1;overflow-y:auto;padding:9px 11px}
.ag-r{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.ag-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;
  background:var(--panel-2);transition:.14s;position:relative}
.ag-item::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;border-radius:2px;background:var(--sc,#cbd0dc)}
.ag-item:hover{border-color:var(--strong-line);background:var(--panel)}
.ag-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--panel)}
.ag-item.sub{margin-left:16px}
.ag-item .at{font-size:12.5px;font-weight:640;line-height:1.42;word-break:break-word;display:flex;gap:5px}
.ag-item .am{font-size:10.5px;color:var(--ui-faint);display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.ag-fold{width:16px;height:16px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--ui-faint);flex:0 0 auto;margin-top:2px}
.ag-fold:hover{background:var(--seg-bg);color:var(--ui-text)}
.ag-empty{padding:26px 12px;text-align:center;color:var(--ui-faint);font-size:12.5px}
.ag-r-hd{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ui-muted);
  display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ag-r-bd{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* 当日议程 · 时间轴（15min 最小单位 / 卡片 / 划选新建 / 长按菜单） */
.tl{display:block;flex:1;min-height:0;position:relative;overflow:auto}
.tl-inner{position:relative;min-width:100%}
.tl-gutter{position:absolute;left:0;top:0;width:46px;bottom:0;z-index:3;background:var(--panel-solid)}
.tl-hour{position:absolute;left:0;right:0;height:52px;box-sizing:border-box;font-size:10.5px;color:var(--ui-faint);
  display:flex;align-items:flex-start;justify-content:flex-end;padding:1px 6px 0 0}
.tl-grid{position:absolute;left:46px;right:0;top:0;bottom:0}
.tl-line{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.5}
.tl-line.hr{background:var(--strong-line);opacity:.9}
.tl-cards{position:absolute;left:46px;right:0;top:0;bottom:0}
.tl-now{position:absolute;left:44px;right:0;height:0;border-top:2px solid #e74c3c;z-index:4;pointer-events:none}
.tl-now::after{content:attr(data-t);position:absolute;left:2px;top:-9px;font-size:10px;color:#e74c3c;
  background:var(--panel-solid);padding:0 4px;border-radius:4px;white-space:nowrap}
.tl-band{position:absolute;left:2px;right:6px;border-radius:8px;background:var(--accent-soft);
  border:1.5px dashed var(--accent-text);z-index:2;pointer-events:none;opacity:.85}
.tl-card{position:absolute;left:0;border-radius:10px;padding:5px 22px 5px 11px;overflow:hidden;cursor:grab;
  box-sizing:border-box;background:var(--panel-solid);border:1px solid var(--line);border-left:3px solid var(--sc,#5b8def);
  color:var(--ui-strong);font-size:11.5px;line-height:1.3;box-shadow:0 1px 3px rgba(16,24,40,.1);
  user-select:none;touch-action:none}
.tl-card .tl-c-t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card .tl-c-r{font-size:10px;color:var(--ui-muted);white-space:nowrap}
.tl-card .tl-c-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%}
.tl-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tl-card.done{opacity:.6}
.tl-card.drag{cursor:grabbing;z-index:6;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.tl-menu{position:absolute;z-index:9;background:var(--panel-solid);border:1px solid var(--strong-line);
  border-radius:11px;padding:5px;box-shadow:0 16px 40px -14px rgba(0,0,0,.45);display:flex;flex-direction:column;
  gap:2px;min-width:148px}
.tl-menu button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;
  font-weight:600;color:var(--ui-text);text-align:left}
.tl-menu button:hover{background:var(--accent-soft);color:var(--accent-text)}
.tl-menu button.danger{color:#c0392b}
.tl-menu button.danger:hover{background:rgba(192,57,43,.14)}
.tl-tip{position:absolute;z-index:8;background:#222;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;
  pointer-events:none;transform:translate(-50%,-140%);white-space:nowrap}

/* 当日统计（液位可视化） */
.ag-stats{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.agstat{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;
  padding:8px 14px 8px 10px;background:var(--panel-2);min-width:186px}
.agstat-tank{flex:0 0 auto;width:40px}
.agstat-tx{min-width:0}
.agstat-k{font-size:11.5px;font-weight:650;color:var(--ui-muted)}
.agstat-v{font-size:19px;font-weight:750;color:var(--ui-strong);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.agstat-s{font-size:11px;color:var(--ui-faint)}

/* 新建弹窗里的只读时间范围 */
.time-chip{display:flex;align-items:center;padding:11px 13px;border:1px solid var(--strong-line);border-radius:11px;
  background:var(--panel-2);font-size:14px;font-weight:650;color:var(--ui-strong)}

/* 待办视图（任务列表 + 历史便签） */
.todo-view{flex:1;min-height:0;overflow:auto;padding:4px 2px 92px;display:flex;flex-direction:column;gap:16px}
.todo-sec{border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);padding:12px 13px;flex:0 0 auto}
.todo-sec-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--ui-strong);
  padding-bottom:9px;margin-bottom:8px;border-bottom:1px dashed var(--line)}
.todo-cnt{font-weight:600;font-size:11.5px;color:var(--ui-muted);background:var(--seg-bg);
  border-radius:20px;padding:1px 9px}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 9px;border-radius:11px;
  cursor:pointer;transition:.14s;position:relative}
.todo-item + .todo-item{border-top:1px solid var(--line)}
.todo-item:hover{background:var(--accent-soft)}
.todo-item.done .todo-t{text-decoration:line-through;color:var(--ui-muted)}
.todo-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.todo-main{flex:1;min-width:0}
.todo-t{font-size:13.5px;font-weight:640;color:var(--ui-strong);line-height:1.4;word-break:break-word}
.todo-m{display:flex;align-items:center;flex-wrap:wrap;gap:4px 9px;margin-top:4px;font-size:11.5px;color:var(--ui-muted)}
.todo-d{white-space:nowrap}
.todo-act{display:flex;align-items:center;gap:2px;flex:0 0 auto;opacity:0;transition:.14s}
.todo-item:hover .todo-act{opacity:1}
@media (hover:none){.todo-act{opacity:1}}
.notes-inline .note-ttl:first-child{margin-top:0}

/* 便签页（整页） */
.notes-view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:2px 0 92px}
.notes-cap{border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);padding:12px;flex:0 0 auto}
.notes-cap textarea{width:100%;box-sizing:border-box;min-height:74px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel-2);padding:10px 12px;font-size:13.5px;resize:vertical;outline:none;line-height:1.6;font-family:inherit}
.notes-cap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.notes-cap-bar{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.notes-cap-bar select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
  font-size:12.5px;outline:none}
.notes-list{border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);padding:12px;flex:0 0 auto}

/* 移动友好日期选择器（自定义日历弹层） */
.dtpick{position:relative}
.dtpick-trigger{display:flex;align-items:center;gap:7px;width:100%;box-sizing:border-box;
  padding:11px 13px;border:1px solid var(--strong-line);border-radius:11px;background:var(--panel-2);
  font-size:14px;font-weight:600;color:var(--ui-strong);cursor:pointer;text-align:left}
.dtpick-trigger b{font-weight:680}
.dtpick-trigger:hover{border-color:var(--accent-text)}
.dtpick-caret{margin-left:auto;color:var(--ui-muted);font-size:12px}
.dtpick-pop{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--panel-solid);
  border:1px solid var(--strong-line);border-radius:14px;padding:12px;box-shadow:0 18px 44px -16px rgba(0,0,0,.4)}
.dtpick-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:13.5px}
.dtpick-nav{width:34px;height:34px;border-radius:9px;background:var(--seg-bg);font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.dtpick-nav:hover{background:var(--accent-soft);color:var(--accent-text)}
.dtpick-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dtpick-dow span{text-align:center;font-size:11px;color:var(--ui-faint);padding:2px 0}
.dtpick-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dtblank{height:38px}
.dtcell{height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ui-strong);
  display:flex;align-items:center;justify-content:center;transition:.12s}
.dtcell:hover{background:var(--accent-soft)}
.dtcell.today{border:1px solid var(--strong-line)}
.dtcell.sel{background:var(--accent-text);color:#fff}
.dtcell.sel.today{border-color:transparent}
.dtpick-today{margin-top:9px;width:100%;padding:9px;border-radius:10px;background:var(--seg-bg);
  font-size:12.5px;font-weight:650;color:var(--accent-text)}
.dtpick-today:hover{background:var(--accent-soft)}

/* 可视化 Markdown 编辑器（可编辑 + 所见即所得） */
.md-wys{flex:1;min-height:180px;overflow-y:auto;padding:14px 18px;outline:none;
  font-size:13.5px;line-height:1.75;word-break:break-word}
.md-wys:empty::before{content:attr(data-ph);color:var(--ui-faint);pointer-events:none}
.md-wys:focus{background:var(--panel-solid)}
.md-tools button.on{background:var(--accent-soft);color:var(--accent-text)}

/* 看板列内的插入点：平时几乎不可见，悬停或选中相邻卡片时露出来 */
.bins-holder{height:16px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.bins-holder::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:transparent;transition:.15s}
.bins-holder button{font-size:10.5px;font-weight:650;color:var(--accent-text);background:var(--panel-solid);
  border-radius:20px;padding:1px 11px;opacity:0;transition:.15s;white-space:nowrap;
  border:1px solid var(--strong-line);position:relative;z-index:1}
.bins-holder:hover::before{background:var(--accent-soft)}
.bins-holder:hover button,.bins-holder.near button{opacity:1}
/* 看板列尾「新建」+ 卡片悬停操作 */
.bcol-add{margin:0 9px 9px;padding:8px;border-radius:10px;font-size:11.5px;font-weight:650;
  color:var(--ui-muted);background:var(--seg-bg);transition:.15s;flex:0 0 auto}
.bcol-add:hover{background:var(--accent-soft);color:var(--accent-text)}
.bcard .bact{display:flex;align-items:center;gap:4px;margin-top:7px;padding-top:7px;
  border-top:1px dashed var(--line);opacity:0;transition:.15s}
.bcard:hover .bact{opacity:1}
.bcard .bact button{font-size:10.5px;font-weight:650;color:var(--ui-muted);background:var(--seg-bg);
  border-radius:7px;padding:3px 8px;transition:.15s;white-space:nowrap}
.bcard .bact button:hover{background:var(--accent-soft);color:var(--accent-text)}
.bcard .bact button.danger:hover{background:rgba(192,57,43,.14);color:#c0392b}

    });

  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function parseDT(s) { if (!s) return null; var d = new Date(s); return isNaN(d.getTime()) ? null : d; }
  function dayOf(s) { return s ? String(s).slice(0, 10) : ''; }
  function dparse(ds) { return ds ? new Date(ds + 'T00:00:00') : null; }
  function nowISO() { return new Date().toISOString(); }
  function hoursBetween(a, b) {
    var x = parseDT(a), y = parseDT(b);
    return (!x || !y) ? 0 : Math.max(0, (y.getTime() - x.getTime()) / 3600000);
  }
  function fmtH(h) {
    if (!h) return '—';
    if (h < 1) return Math.round(h * 60) + ' 分';
    if (h < 48) return (Math.round(h * 10) / 10) + ' 小时';
    return (Math.round(h / 24 * 10) / 10) + ' 天';
  }
  function fmtDT(s) {
    var d = parseDT(s);
    if (!d) return '—';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtDay(s) { var t = dayOf(s); return t ? (Number(t.slice(5, 7)) + '/' + Number(t.slice(8, 10))) : '—'; }
  function diffDays(a, b) { return Math.round((dparse(b) - dparse(a)) / 86400000); }

  function stMeta(name) {
    for (var i = 0; i < STATUSES.length; i++) { if (STATUSES[i].n === name) return STATUSES[i]; }

  }

  function toast(msg, ms) {

  function rid(rec) { return rec ? (rec['_id'] || rec['record_id'] || rec['id'] || '') : ''; }
  function normIds(list) {

  }
  function inInput(el) {
    if (!el) return false;
    var tag = (el.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable === true;
  }

  /* =====================================================================
     1. Markdown 渲染（轻量、无依赖、ES5）
     ===================================================================== */
  function mdInline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function (a, b) { return '\u0001' + b + '\u0001'; });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_,a,u) { var safe=OneDayCore.safeURL(odUnescape(u),true); return safe ? '<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(safe)+'" alt="'+a+'">' : a; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_,a,u) { var safe=OneDayCore.safeURL(odUnescape(u),false); return safe ? '<a href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">'+a+'</a>' : a+' <small>（已拦截不安全链接）</small>'; });
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
    s = s.replace(/\u0001([^\u0001]+)\u0001/g, '<code>$1</code>');
    return s;
  }
  function isSepLine(s) { return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.indexOf('-') > -1; }

  function mdToHtml(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var ln = lines[i];

      if (/^\s*```/.test(ln)) {
        var lang = ln.replace(/^\s*```/, '').trim(), code = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push('<pre><code' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '>' +
                 esc(code.join('\n')) + '</code></pre>');
        continue;
      }
      if (/^\s*$/.test(ln)) { i++; continue; }

      var hm = ln.match(/^(#{1,6})\s+(.*)$/);
      if (hm) { var lv = Math.min(hm[1].length, 4); out.push('<h' + lv + '>' + mdInline(hm[2]) + '</h' + lv + '>'); i++; continue; }

      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }

      if (/^\s*>\s?/.test(ln)) {
        var qs = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { qs.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + mdToHtml(qs.join('\n')) + '</blockquote>');
        continue;
      }
      if (/^\s*\|/.test(ln) && i + 1 < lines.length && isSepLine(lines[i + 1])) {
        var heads = ln.split('|').slice(1, -1);
        var rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
        var tb = '<table><thead><tr>';
        for (var a1 = 0; a1 < heads.length; a1++) { tb += '<th>' + mdInline(heads[a1].trim()) + '</th>'; }
        tb += '</tr></thead><tbody>';
        for (var r1 = 0; r1 < rows.length; r1++) {
          tb += '<tr>';
          for (var c1 = 0; c1 < heads.length; c1++) {
            tb += '<td>' + mdInline((rows[r1][c1] || '').trim()) + '</td>';
          }
          tb += '</tr>';
        }
        out.push(tb + '</tbody></table>');
        continue;
      }
      if (/^\s*[-*+]\s+/.test(ln)) {
        var lis = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*[-*+]\s+/, '');
          var tm = item.match(/^\[([ xX])\]\s*(.*)$/);
          if (tm) {
            var done = tm[1].toLowerCase() === 'x';
            lis.push('<li class="task' + (done ? ' done' : '') + '"><span class="box">✓</span><span>' +
                     mdInline(tm[2]) + '</span></li>');
          } else { lis.push('<li>' + mdInline(item) + '</li>'); }
          i++;
        }
        out.push('<ul>' + lis.join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(ln)) {
        var ols = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
          ols.push('<li>' + mdInline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ol>' + ols.join('') + '</ol>');
        continue;
      }
      var ps = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,6}\s|>|[-*+]\s|\d+[.)]\s|```|\|)/.test(lines[i])) {
        ps.push(lines[i]); i++;
      }
      if (ps.length) out.push('<p>' + mdInline(ps.join('<br>')) + '</p>');
      else { i++; }
    }
    return out.join('\n');
  }

    return out;
  }
  function calMarkClass(ds) {
    var ms = calMarksOf(ds), best = '';
    for (var i = 0; i < ms.length; i++) {
      var t = ms[i]['标记类型'];
      if (t === '请假') return 'leave';
      if (t === '法定节假日') best = 'holiday';
      else if (t === '调休上班' && !best) best = 'workday';
    }
    return best;
  }

  /** 软删除：任务连同子任务进回收站（保留标签关联与时间日志），仅手动永久删除 */
  function removeTask(id,cb) {
    var ids=[id].concat(OneDayCore.descendants(id,S.tasks)),i=0;
    (function next(){if(i===ids.length){if(cb)cb(null);return;}
      updTask(ids[i++],{'回收站':{checkbox:true},'删除时间':{date:nowISO()}},function(err){
        if(err){if(cb&&cb.length)cb(err);return;}next();
      });})();
  }

  function restoreTask(id,cb) {
    var ids=[id].concat(OneDayCore.descendants(id,S.tasks)),i=0;
    (function next(){if(i===ids.length){if(cb)cb(null);return;}
      updTask(ids[i++],{'回收站':{checkbox:false}},function(err){if(err){if(cb&&cb.length)cb(err);return;}next();});})();
  }

  function purgeTask(id, cb) {
    var rels = taskTags(id), i = 0;
    (function step() {
      if (i >= rels.length) { delTask(id, function () { if (cb) cb(); }); return; }
      delLink(rels[i]['_id'], function () { i++; step(); });
    })();
  }
  /** 惰性清理：进入页面时把回收站里超过 30 天的任务真正删掉 */
  function purgeRecycled() { /* v10: irreversible deletion is always explicit; never purge on loading. */ }

  function subTasksIncludingRecycled(pid) {
    var out = [];
    if (!pid) return out;
    for (var i = 0; i < S.tasks.length; i++) {
      if (S.tasks[i]['父任务ID'] === pid) out.push(S.tasks[i]);
    }
    return out;
  }
  function recycledTasks() {
    var out = [];
    for (var i = 0; i < S.tasks.length; i++) { if (S.tasks[i]['回收站']) out.push(S.tasks[i]); }
    out.sort(function (a, b) {
      return String(b['删除时间'] || '').localeCompare(String(a['删除时间'] || ''));
    });
    return out;
  }
  function recycleDaysLeft(t) {
    var d = parseDT(t['删除时间']);
    if (!d) return RECYCLE_DAYS;
    return Math.max(0, RECYCLE_DAYS - Math.floor((Date.now() - d.getTime()) / 86400000));
  }

  function reload(cb) {
    if (!dbReady) { S.loading=false;renderAll();if(cb)cb(new Error('未检测到资料库环境'));return; }
    if (OD.reading) { OD.reloadAgain=true;if(cb)OD.waiters.push(cb);return; }
    OD.reading=true;OD.reloadAgain=false;if(cb)OD.waiters.push(cb);
    var keys=['tasks','logs','tags','links','notes','sets','cal'];
    var reads=[qTasks,qLogs,qTags,qLinks,qNotes,qSets,qCal];
    Promise.all(reads.map(function(fn){return new Promise(function(resolve,reject){
      var timer=setTimeout(function(){reject(new Error('读取超时'));},15000);
      fn(function(rows,err){clearTimeout(timer);if(err)reject(err);else resolve(normIds(rows));});
    });})).then(function(values){
      keys.forEach(function(k,i){S[k]=values[i];});S.loading=false;OD.hasSnapshot=true;
      OD.lastRead=Date.now();OD.readError='';OD.reading=false;pullRemoteBg();renderAll();
      var callbacks=OD.waiters.splice(0);callbacks.forEach(function(f){f(null);});
      if(OD.reloadAgain){OD.reloadAgain=false;setTimeout(function(){reload();},100);}
    },function(err){

  function pullRemoteBg() {
    for (var i = 0; i < S.sets.length; i++) {
      if (S.sets[i]['设置项'] === 'workbench.bg') {
        try {
          var o = JSON.parse(S.sets[i]['设置值'] || '{}');
          if (o && o.type) { applyBg(mergeBg(o), true); try { localStorage.setItem(LSK, JSON.stringify({ bg: BG })); } catch (e) {} }
        } catch (e) {}
      }
    }
  }
  function mergeBg(o) {
    var out = {}, k;
    for (k in BG_DEFAULT) { if (BG_DEFAULT.hasOwnProperty(k)) out[k] = BG_DEFAULT[k]; }
    for (k in o) { if (o.hasOwnProperty(k) && o[k] !== undefined && o[k] !== null) out[k] = o[k]; }
    return out;
  }
  /* =====================================================================
     5. 时间维度与筛选
     ===================================================================== */
  function period() {
    var t = today(), a, b;
    if (S.period === 'today') { a = t; b = t; }
    else if (S.period === 'week') {
      var wd = (t.getDay() + 6) % 7;
      a = addDays(t, -wd); b = addDays(a, 6);
    } else if (S.period === 'month') {
      a = new Date(t.getFullYear(), t.getMonth(), 1);
      b = new Date(t.getFullYear(), t.getMonth() + 1, 0);
    } else if (S.period === 'quarter') {
      var q = Math.floor(t.getMonth() / 3);
      a = new Date(t.getFullYear(), q * 3, 1);
      b = new Date(t.getFullYear(), q * 3 + 3, 0);
    } else if (S.period === 'custom') {
      if (!S.from || !S.to) return null;
      return { a: S.from, b: S.to, days: Math.max(1, diffDays(S.from, S.to) + 1) };
    } else { return null; }
    return { a: dstr(a), b: dstr(b), days: Math.max(1, diffDays(dstr(a), dstr(b)) + 1) };
  }
  function inPeriod(t, p) {
    if (!p) return true;
    var ps = dayOf(t['计划开始时间']), pe = dayOf(t['计划截止时间']);
    if (!ps && !pe) {
      var cr = dayOf(t['创建时间']);
      return cr ? (cr >= p.a && cr <= p.b) : true;
    }
    var s = ps || pe, e = pe || ps;
    return s <= p.b && e >= p.a;
  }
  function anchorOf(t) {
    return dayOf(t['计划截止时间']) || dayOf(t['计划开始时间']) || dayOf(t['创建时间']);
  }
  function matchFilters(t, opts) {
    if (S.fStatus && (t['任务状态'] || ST_DEFAULT) !== S.fStatus) return false;
    if (S.fPrio && (t['优先级'] || '') !== S.fPrio) return false;
    if (S.fTag && !hasTag(t['_id'], S.fTag)) return false;
    if (S.kw) {
      var hay = (t['任务标题'] || '') + ' ' + (t['任务描述'] || '') + ' ' + (t['任务详情'] || '') + ' ' +
                tagsOf(t['_id']).join(' ');
      if (hay.toLowerCase().indexOf(S.kw.toLowerCase()) === -1) return false;
    }
    return true;
  }
  function filtered(opts) {
    opts = opts || {};
    var p = opts.ignorePeriod ? null : period(), out = [];
    for (var i = 0; i < S.tasks.length; i++) {
      var t = S.tasks[i];
      if (t['回收站']) continue;
      if (!inPeriod(t, p)) continue;
      if (!matchFilters(t, opts)) continue;
      out.push(t);
    }
    return out;
  }
  function isOverdue(t) {
    if (isTerminal(t['任务状态'])) return false;
    var e = dayOf(t['计划截止时间']);
    return e ? e < dstr(today()) : false;
  }
  function isSoon(t) {
    if (isTerminal(t['任务状态'])) return false;
    var e = dayOf(t['计划截止时间']);
    if (!e) return false;
    var d = diffDays(dstr(today()), e);
    return d >= 0 && d <= 2;
  }

  /* ---------- 9.1a 当日统计（已完成 / 待办 · 小时与占比） ---------- */

  /* ---------- 9.1b 时间轴（15min 最小单位 · 卡片 · 点击/划选新建 · 长按菜单） ---------- */
  function pad2(n) { n = Math.max(0, Math.floor(n)); return (n < 10 ? '0' : '') + n; }

    }
    function openMenu(card, id) {
      closeMenu();

      m.className = 'tl-menu';
      m.innerHTML = '<button data-tmm="done">✅ 标记完成</button>' +

      m.style.left = Math.min(r.left - rr.left + root.scrollLeft, Math.max(8, root.clientWidth - 156)) + 'px';
      m.style.top = (r.top - rr.top + root.scrollTop) + 'px';
      m.addEventListener('click', function (ev) {
        var b = ev.target.closest ? ev.target.closest('button') : null;
        if (!b) return;

      });

    }
    function selectCard(id) {
      S.agTask = id;
      if (st.role === 'main') {
        if (S.agParent === id) {
          /* 重复选中同一张卡片：保持当前子时间轴的展开 / 收起状态（供双击切换） */
        } else if (S.agParent) {
          S.agParent = ''; S.agForceSub = false;              /* 切到别的任务 */
        } else {
          S.agParent = (subCount(id) > 0) ? id : '';          /* 首次选中：有子任务则自动展开 */

    function expandSubs(id) {

      if (S.agParent === id) {

        S.agParent = id; S.agForceSub = true;

    function openCreateAt(a, b) {
      openCreate({ date: st.ds, startMin: a, endMin: b, agenda: st.ds, parent: st.role === 'sub' ? st.parentId : '' });

    /* 空白处：点击 / 划选 → 新建 */
    function emptyDown(ev) {
      var startMin = yToMin(ev.clientY || (ev.touches && ev.touches[0].clientY));
      var moved = false, curMin = startMin, done = false;
      showBand(startMin, startMin + TL_SNAP);
      function cleanup() {
        document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up);
        hideTip(); clearBand();
      }
      function move(e2) {
        if (done) return;
        var y = (e2.touches && e2.touches[0]) ? e2.touches[0].clientY : e2.clientY;
        curMin = yToMin(y);
        if (Math.abs(curMin - startMin) >= TL_SNAP) moved = true;
        showBand(startMin, curMin);
        showTip(fmtMin(Math.min(startMin, curMin)) + ' – ' + fmtMin(Math.max(startMin, curMin)), y);
      }
      function up() {
        if (done) return;
        done = true; cleanup();
        var a = Math.min(startMin, curMin), b = Math.max(startMin, curMin);
        if (!moved || b - a < TL_SNAP) { a = startMin; b = Math.min(startMin + 60, TL_DAY * 60); }
        openCreateAt(a, b);
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', up);
    }
    /* 卡片：点选 / 双击展开收缩 / 拖动移动 / 长按菜单 */
    function cardDown(ev, card) {
      ev.preventDefault();
      var id = card.getAttribute('data-tl-id');
      var origS = Number(card.getAttribute('data-start')), origE = Number(card.getAttribute('data-end'));
      var dur = origE - origS;
      var startY = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
      var moved = 0, curS = origS, curE = origE, longFired = false, done = false;
      var lp = setTimeout(function () { if (moved < 4) { longFired = true; openMenu(card, id); } }, 500);
      card.classList.add('drag');
      function cleanup() {
        clearTimeout(lp);
        document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up);
        hideTip(); card.classList.remove('drag');
      }
      function move(e2) {
        if (done || longFired) return;
        var y = (e2.touches && e2.touches[0]) ? e2.touches[0].clientY : e2.clientY;
        moved = Math.max(moved, Math.abs(y - startY));
        if (moved >= 4) { clearTimeout(lp); }   /* 一旦拖动即取消长按，避免拖完又弹菜单 */
        if (moved < 4) return;
        var dMin = Math.round((y - startY) / TL_HOUR_H * 60 / TL_SNAP) * TL_SNAP;
        curS = tlClamp(origS + dMin, 0, TL_DAY * 60 - dur); curE = curS + dur;
        card.style.top = (curS / (TL_DAY * 60) * TL_TOTAL).toFixed(1) + 'px';
        var r = card.querySelector('.tl-c-r'); if (r) r.textContent = fmtMin(curS) + ' – ' + fmtMin(curE);
        showTip(fmtMin(curS) + ' – ' + fmtMin(curE), y);
      }
      function up() {
        if (done) return;
        done = true; cleanup();
        if (longFired) return;
        if (moved < 4) {
          /* 手动双击识别（重渲染会换掉卡片节点，原生 dblclick 不可靠） */
          var t = Date.now();
          if (root.__tl && root.__tl.lastId === id && (t - root.__tl.lastT) < 360 && st.role === 'main') {
            root.__tl.lastId = ''; root.__tl.lastT = 0;
            toggleSubs(id);
            return;
          }
          if (root.__tl) { root.__tl.lastId = id; root.__tl.lastT = t; }
          selectCard(id);
          return;
        }
        updTask(id, { '计划开始时间': { date: minToISO(st.ds, curS) }, '计划截止时间': { date: minToISO(st.ds, curE) } },
          function (err) {
            if (err) toast('时间保存失败'); else toast('时间已调整 · ' + fmtMin(curS) + '–' + fmtMin(curE));
            reload(function () { renderAgenda(); });
          });
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', up);
    }
    function onDown(ev) {
      if (ev.target.closest && ev.target.closest('.tl-menu')) return;
      var card = ev.target.closest ? ev.target.closest('.tl-card') : null;
      if (card) { cardDown(ev, card); return; }
      if (ev.target.closest && ev.target.closest('.tl-now')) return;
      closeMenu();
      emptyDown(ev);
    }
    root.addEventListener('mousedown', onDown);
    root.addEventListener('touchstart', onDown, { passive: false });
  }

  /* =====================================================================
     10. 状态流转（写日志 + 更新任务）
     ===================================================================== */
  function switchStatus(taskId,next,done) {
    var t=byId(taskId);if(!t){if(done&&done.length)done(new Error('任务不存在'));return;}
    var cur=t['任务状态']||ST_DEFAULT;if(cur===next){if(done)done(null);return;}
    var ts=nowISO(),start=t['状态开始时间']||t['创建时间']||ts;
    var props={'任务状态':{select:next},'状态开始时间':{date:ts}};
    if(next==='完成')props['任务进度']={number:100};
    // Persist the actual task first. Logging is a separate non-transactional write.
    updTask(taskId,props,function(err){
      if(err){if(done&&done.length)done(err);return;}
      t['任务状态']=next;t['状态开始时间']=ts;
      var logs=taskLogs(taskId),open=null;
      for(var i=0;i<logs.length;i++)if(logs[i]['状态']===cur&&!logs[i]['结束时间']&&logs[i]['开始时间']===start)open=logs[i];
      var lp={'结束时间':{date:ts},'持续时长':{number:Math.round(hoursBetween(start,ts)*100)/100}};
      function finish(e){if(e){toast('任务状态已保存，但日志补记失败。请在日志页核对。',6000);}if(done)done(null);}
      if(open){updLog(rid(open),lp,finish);}else{
        lp['日志标题']={text:(t['任务标题']||'任务')+' · '+cur};lp['任务ID']={text:taskId};
        lp['任务标题']={text:t['任务标题']||''};lp['任务类型']={select:t['任务类型']||'主任务'};
        lp['状态']={select:cur};lp['开始时间']={date:start};addLog(lp,finish);
      }
    });
  }

  function closeModal() {
    var r = $('modalRoot');

    while (r.firstChild) r.removeChild(r.firstChild);
  }
  function closeDrawer() {
    var r = $('drawerRoot');
    odFlush(r);
    while (r.firstChild) r.removeChild(r.firstChild);

  function openModalRaw(cls, inner) {
    closeModal();

    mask.className = 'mask';
    mask.innerHTML = '<div class="dlg ' + (cls || 'w620') + '">' + inner + '</div>';
    mask.addEventListener('click', function (e) { if (e.target === mask) closeModal(); });

  function modal(opts) {

      (opts.head || '') + '<button class="ico-btn" data-close="1">✕</button></div>';

  /** 叠在已有弹窗之上的对话框（不销毁下层，例如在任务详情里挑图标） */
  function layerDialog(title, cls, body, foot) {
    var lastFocus=document.activeElement;
    var mask = document.createElement('div');
    mask.className = 'mask';
    mask.style.zIndex = '80';
    mask.innerHTML = '<div class="dlg ' + cls + '">' +
      '<div class="dlg-hd"><h3>' + esc(title) + '</h3><div class="grow"></div>' +
      '<button class="ico-btn" data-close="1">✕</button></div>' +
      '<div class="dlg-bd">' + body + '</div>' +
      (foot ? '<div class="dlg-ft">' + foot + '</div>' : '') + '</div>';
    var close=function(){odFlush(mask);if(mask.parentNode)mask.parentNode.removeChild(mask);if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});};
    mask.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-close]');if(e.target===mask||(b&&b.closest('.mask')===mask)){e.stopPropagation();close();}});
    $('modalRoot').appendChild(mask);
    mask.__close=close;
